<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
  <meta name="theme-color" content="#0c347d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Inspectores Peñaflor">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/jpeg" href="./assets/logo-penaflor.jpg">
  <link rel="apple-touch-icon" href="./assets/logo-penaflor.jpg">
  <title>Departamento de Inspectores Comerciales - Peñaflor</title>
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
  :root {
    --primary: #0c347d;
    --primary-mid: #1649a3;
    --primary-dark: #071e4b;
    --accent: #0ea5e9;
    --primary-light: #ebf3fe;
    --bg: #f1f5f9;
    --surface: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --success: #10b981;
    --warning: #f59e0b;
    --danger: #ef4444;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.05), 0 1px 2px rgba(15, 23, 42, 0.04);
    --shadow: 0 4px 16px -2px rgba(12, 52, 125, 0.08), 0 2px 6px -2px rgba(15, 23, 42, 0.04);
    --shadow-lg: 0 14px 32px -6px rgba(12, 52, 125, 0.16), 0 4px 12px -4px rgba(15, 23, 42, 0.06);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Plus Jakarta Sans', 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14.5px;
    line-height: 1.45;
    padding-bottom: 78px;
    -webkit-font-smoothing: antialiased;
  }

  /* ICONOS MODERNOS MATERIAL SYMBOLS ROUNDED */
  .material-icons, .ms-ico {
    font-family: 'Material Symbols Rounded', 'Material Icons';
    font-weight: normal;
    font-style: normal;
    font-size: 22px;
    line-height: 1;
    letter-spacing: normal;
    text-transform: none;
    display: inline-block;
    white-space: nowrap;
    word-wrap: normal;
    direction: ltr;
    -webkit-font-smoothing: antialiased;
    font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
  }

  /* BARRA SUPERIOR INSTITUCIONAL */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 120;
    background: linear-gradient(100deg, #082357 0%, #0c347d 52%, #1552b8 100%);
    color: #fff;
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 9px 16px;
    box-shadow: 0 4px 18px rgba(8, 35, 87, 0.28);
    backdrop-filter: blur(8px);
  }
  .topbar-logo-wrap {
    background: #fff;
    border-radius: 10px;
    padding: 3px 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
  }
  .topbar-logo {
    height: 36px;
    width: auto;
    display: block;
    object-fit: contain;
  }
  .topbar-title { flex: 1; min-width: 0; }
  .topbar-title h1 {
    margin: 0;
    font-size: 15.5px;
    font-weight: 800;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: -0.2px;
  }
  .topbar-title small {
    display: block;
    font-size: 11px;
    opacity: 0.88;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .icon-btn {
    background: rgba(255, 255, 255, 0.14);
    border: 1px solid rgba(255, 255, 255, 0.16);
    color: #fff;
    width: 38px;
    height: 38px;
    border-radius: 12px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.18s ease;
    flex-shrink: 0;
  }
  .icon-btn:hover { background: rgba(255, 255, 255, 0.26); transform: translateY(-1px); }
  .icon-btn.hidden { display: none; }

  .install-pill {
    background: #ffffff;
    color: var(--primary);
    border: none;
    border-radius: 12px;
    padding: 7px 13px;
    font-size: 12.5px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.18);
    transition: all 0.18s ease;
    flex-shrink: 0;
  }
  .install-pill:hover { background: #e8f1fc; transform: translateY(-1px); }
  .install-pill .material-icons { font-size: 17px; }

  /* HERO BANNER INSTITUCIONAL PREMIUM */
  .dept-hero {
    position: relative;
    overflow: hidden;
    background: linear-gradient(125deg, #082357 0%, #0c347d 55%, #1654b8 100%);
    color: #fff;
    border-radius: 18px;
    padding: 20px 22px;
    margin-bottom: 22px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    box-shadow: var(--shadow-lg);
  }
  .dept-hero::after {
    content: '';
    position: absolute;
    right: -60px;
    top: -60px;
    width: 240px;
    height: 240px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0) 70%);
    pointer-events: none;
  }
  .dept-hero-left {
    display: flex;
    align-items: center;
    gap: 16px;
    min-width: 240px;
    z-index: 1;
  }
  .dept-hero-logo {
    height: 60px;
    width: auto;
    max-width: 110px;
    flex-shrink: 0;
    object-fit: contain;
    border-radius: 12px;
    background: #fff;
    padding: 5px 8px;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.22);
  }
  .dept-hero h2 {
    margin: 0;
    font-size: 20px;
    color: #fff;
    font-weight: 800;
    letter-spacing: -0.3px;
  }
  .dept-hero p {
    margin: 4px 0 0;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.86);
    font-weight: 500;
  }
  .conn-badge {
    z-index: 1;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  .conn-badge:hover { transform: scale(1.02); }
  .conn-badge.live { background: rgba(16, 185, 129, 0.2); color: #d1fae5; border: 1px solid rgba(110, 231, 183, 0.45); }
  .conn-badge.demo { background: rgba(255, 255, 255, 0.16); color: #fef3c7; border: 1px solid rgba(253, 224, 71, 0.45); }

  /* LAYOUT DESKTOP + MOBILE */
  .app-shell {
    display: flex;
    max-width: 1500px;
    margin: 0 auto;
    min-height: calc(100vh - 58px);
  }
  .sidebar {
    display: none;
    width: 274px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 16px 14px;
  }
  .sidebar-brand {
    text-align: center;
    padding: 12px 10px 16px;
    border-radius: 14px;
    background: linear-gradient(180deg, #f8fbff 0%, #edf4ff 100%);
    border: 1px solid #dbe7fa;
    margin-bottom: 14px;
  }
  .sidebar-brand img {
    max-width: 100%;
    height: 60px;
    object-fit: contain;
    margin-bottom: 8px;
    border-radius: 8px;
  }
  .sidebar-brand .dept-name {
    font-size: 13.5px;
    font-weight: 800;
    color: var(--primary);
    line-height: 1.25;
  }
  .sidebar-brand .dept-sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 3px;
    font-weight: 500;
  }
  .sidebar-item {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    border: none;
    background: transparent;
    color: #334155;
    padding: 11px 14px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    text-align: left;
    margin-bottom: 4px;
    transition: all 0.15s ease;
  }
  .sidebar-item .material-icons { font-size: 20px; color: #64748b; transition: color 0.15s; }
  .sidebar-item:hover { background: #f1f5f9; color: var(--primary); }
  .sidebar-item:hover .material-icons { color: var(--primary); }
  .sidebar-item.active {
    background: linear-gradient(90deg, #0c347d 0%, #164ca8 100%);
    color: #fff;
    font-weight: 700;
    box-shadow: 0 4px 12px rgba(12, 52, 125, 0.24);
  }
  .sidebar-item.active .material-icons { color: #fff; }
  .sidebar-divider { height: 1px; background: var(--border); margin: 14px 6px; }
  .sidebar-footer {
    padding: 10px 12px;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.55;
    background: #f8fafc;
    border-radius: 10px;
    border: 1px solid var(--border);
  }

  .main-content { flex: 1; min-width: 0; padding: 14px; }

  /* BARRA INFERIOR MÓVIL */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 120;
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-around;
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
    box-shadow: 0 -4px 18px rgba(12, 52, 125, 0.08);
  }
  .nav-btn {
    flex: 1;
    border: none;
    background: none;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    font-size: 10.5px;
    font-weight: 600;
    padding: 5px 2px;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .nav-btn.active { color: var(--primary); font-weight: 800; }
  .nav-btn.active .material-icons {
    background: var(--primary-light);
    color: var(--primary);
    padding: 3px 12px;
    border-radius: 14px;
  }
  .nav-btn .material-icons { font-size: 21px; padding: 3px 12px; }

  @media (min-width: 920px) {
    body { padding-bottom: 0; }
    .sidebar { display: block; }
    .bottom-nav { display: none; }
    .main-content { padding: 24px 30px; }
    .topbar-title h1 { font-size: 17px; }
  }

  /* TARJETAS DE MENÚ CON ÍCONOS GRADIENTE POR CATEGORÍA */
  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
    gap: 14px;
  }
  .menu-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 14px 16px;
    text-align: center;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-height: 142px;
    position: relative;
  }
  .menu-card:hover {
    transform: translateY(-4px);
    border-color: #93c5fd;
    box-shadow: var(--shadow-lg);
  }
  .menu-card .card-icon {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: linear-gradient(135deg, #0c347d 0%, #1d5fd1 100%);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 14px -3px rgba(12, 52, 125, 0.32);
    transition: transform 0.2s ease;
  }
  .menu-card:hover .card-icon { transform: scale(1.07); }
  .menu-card .card-icon .material-icons { font-size: 28px; color: #fff; }

  /* Paletas semánticas de íconos */
  .card-icon.ic-blue   { background: linear-gradient(135deg, #0c347d 0%, #2563eb 100%); box-shadow: 0 6px 14px -3px rgba(37, 99, 235, 0.38); }
  .card-icon.ic-indigo { background: linear-gradient(135deg, #312e81 0%, #6366f1 100%); box-shadow: 0 6px 14px -3px rgba(99, 102, 241, 0.38); }
  .card-icon.ic-cyan   { background: linear-gradient(135deg, #0e7490 0%, #06b6d4 100%); box-shadow: 0 6px 14px -3px rgba(6, 182, 212, 0.38); }
  .card-icon.ic-amber  { background: linear-gradient(135deg, #b45309 0%, #f59e0b 100%); box-shadow: 0 6px 14px -3px rgba(245, 158, 11, 0.38); }
  .card-icon.ic-green  { background: linear-gradient(135deg, #047857 0%, #10b981 100%); box-shadow: 0 6px 14px -3px rgba(16, 185, 129, 0.38); }
  .card-icon.ic-teal   { background: linear-gradient(135deg, #0f766e 0%, #14b8a6 100%); box-shadow: 0 6px 14px -3px rgba(20, 184, 166, 0.38); }
  .card-icon.ic-purple { background: linear-gradient(135deg, #6d28d9 0%, #8b5cf6 100%); box-shadow: 0 6px 14px -3px rgba(139, 92, 246, 0.38); }
  .card-icon.ic-red    { background: linear-gradient(135deg, #b91c1c 0%, #ef4444 100%); box-shadow: 0 6px 14px -3px rgba(239, 68, 68, 0.38); }
  .card-icon.ic-rose   { background: linear-gradient(135deg, #be123c 0%, #f43f5e 100%); box-shadow: 0 6px 14px -3px rgba(244, 63, 94, 0.38); }
  .card-icon.ic-sky    { background: linear-gradient(135deg, #0369a1 0%, #0ea5e9 100%); box-shadow: 0 6px 14px -3px rgba(14, 165, 233, 0.38); }

  .menu-card img.card-thumb {
    width: 64px;
    height: 64px;
    object-fit: cover;
    border-radius: 14px;
    border: 1px solid var(--border);
  }
  .menu-card .card-title {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.28;
  }
  .menu-card .card-sub {
    font-size: 11px;
    color: var(--muted);
    font-weight: 500;
    margin-top: -4px;
  }

  /* SECCIONES Y TARJETAS */
  .section-header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
  }
  .section-header h2 {
    margin: 0;
    font-size: 19px;
    font-weight: 800;
    color: var(--primary);
    letter-spacing: -0.3px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }

  /* BOTONES */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: none;
    border-radius: var(--radius-sm);
    padding: 10px 16px;
    font-size: 13.5px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.16s ease;
  }
  .btn:hover:not(:disabled) { transform: translateY(-1px); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-primary {
    background: linear-gradient(135deg, #0c347d 0%, #1652ba 100%);
    color: #fff;
    box-shadow: 0 4px 12px rgba(12, 52, 125, 0.24);
  }
  .btn-primary:hover { box-shadow: 0 6px 16px rgba(12, 52, 125, 0.34); }
  .btn-outline { background: #fff; color: #334155; border: 1px solid #cbd5e1; }
  .btn-outline:hover { background: #f8fafc; border-color: var(--primary); color: var(--primary); }
  .btn-success { background: linear-gradient(135deg, #059669 0%, #10b981 100%); color: #fff; box-shadow: 0 3px 10px rgba(16, 185, 129, 0.25); }
  .btn-danger { background: linear-gradient(135deg, #dc2626 0%, #ef4444 100%); color: #fff; }
  .btn-sm { padding: 7px 12px; font-size: 12px; border-radius: 8px; }

  /* FORMULARIOS */
  .form-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 720px) {
    .form-grid { grid-template-columns: repeat(2, 1fr); }
    .form-field.full-width { grid-column: 1 / -1; }
  }
  .form-field label {
    display: block;
    font-size: 11.5px;
    font-weight: 700;
    color: #334155;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .form-control {
    width: 100%;
    padding: 10px 13px;
    border: 1.5px solid #cbd5e1;
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
    color: var(--text);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .form-control:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3.5px rgba(12, 52, 125, 0.14);
  }
  textarea.form-control { min-height: 88px; resize: vertical; }

  /* DESPLEGABLE MULTI-SELECCIÓN */
  .ms-dropdown { position: relative; width: 100%; }
  .ms-trigger {
    width: 100%;
    min-height: 44px;
    padding: 6px 36px 6px 10px;
    border: 1.5px solid #cbd5e1;
    border-radius: 10px;
    background: #fff;
    cursor: pointer;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 5px;
    position: relative;
    transition: border-color 0.15s;
  }
  .ms-trigger:hover, .ms-dropdown.open .ms-trigger {
    border-color: var(--primary);
    box-shadow: 0 0 0 3.5px rgba(12, 52, 125, 0.12);
  }
  .ms-placeholder { color: #94a3b8; font-size: 13.5px; padding: 2px; }
  .ms-arrow {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    color: var(--muted); pointer-events: none; transition: transform 0.15s;
  }
  .ms-dropdown.open .ms-arrow { transform: translateY(-50%) rotate(180deg); color: var(--primary); }
  .ms-tag {
    background: var(--primary-light); color: var(--primary); border: 1px solid #bfdbfe;
    border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .ms-panel {
    display: none; position: absolute; left: 0; right: 0; top: calc(100% + 5px);
    z-index: 90; background: #fff; border: 1px solid #cbd5e1; border-radius: 12px;
    box-shadow: var(--shadow-lg); padding: 10px;
  }
  .ms-dropdown.open .ms-panel { display: block; }
  .ms-search {
    width: 100%; padding: 8px 10px; border: 1px solid #dce4f0; border-radius: 8px;
    font-size: 13px; margin-bottom: 6px; font-family: inherit;
  }
  .ms-actions {
    display: flex; justify-content: space-between; gap: 6px; padding: 4px 2px 6px;
    border-bottom: 1px solid #f1f5f9; margin-bottom: 4px;
  }
  .ms-actions button {
    border: none; background: none; color: #1652ba; font-size: 12px; font-weight: 700;
    cursor: pointer; padding: 2px 4px; font-family: inherit;
  }
  .ms-options { max-height: 220px; overflow-y: auto; }
  .ms-opt {
    display: flex; align-items: center; gap: 9px; padding: 8px; border-radius: 8px;
    cursor: pointer; font-size: 13.5px; user-select: none;
  }
  .ms-opt:hover { background: var(--primary-light); }
  .ms-opt input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--primary); cursor: pointer; }

  /* MEDIA Y FIRMA */
  .photo-box {
    border: 2px dashed #cbd5e1; border-radius: 12px; padding: 14px;
    text-align: center; background: #f8fafc;
  }
  .photo-preview { max-width: 100%; max-height: 180px; border-radius: 10px; margin-top: 8px; display: none; }
  .sig-pad {
    width: 100%; height: 170px; border: 1.5px solid #cbd5e1; border-radius: 12px;
    background: #fff; touch-action: none; cursor: crosshair;
  }
  .loc-row { display: flex; gap: 8px; }

  /* TABLAS */
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; align-items: center; }
  .search-input { flex: 1; min-width: 210px; }
  .table-wrap {
    overflow-x: auto; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
  }
  table.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.data-table th {
    background: #f8fafc; color: var(--primary); font-weight: 800; font-size: 11.5px;

    // ========================================================================
    // MOTOR DE CACHÉ ULTRA-RÁPIDO (STALE-WHILE-REVALIDATE + PREFETCH + DEDUP)
    // ========================================================================
    var SWR_PREFIX = 'INSP_SWR_V1:';
    var memCache = {};
    var inFlight = {};
    var prefetchedOnce = false;

    function getCacheKey(action, payload) {
      if (action === 'rows' || action === 'map') return action + ':' + ((payload && payload.table) || '');
      if (action === 'feriaAttendance') return action + ':' + ((payload && payload.feria) || '') + ':' + ((payload && payload.fecha) || '');
      return action;
    }

    function readCache(key) {
      if (memCache[key]) return memCache[key];
      try {
        var raw = localStorage.getItem(SWR_PREFIX + key);
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && parsed.data) {
            memCache[key] = parsed;
            return parsed;
          }
        }
      } catch (e) {}
      return null;
    }

    function writeCache(key, data) {
      if (!data || data.ok === false || data.error) return;
      var entry = { ts: Date.now(), data: data };
      memCache[key] = entry;
      try {
        var str = JSON.stringify(entry);
        if (str.length < 450000) {
          localStorage.setItem(SWR_PREFIX + key, str);
        }
      } catch (e) {}
    }

    function invalidateCacheForWrite(action, payload) {
      var keysToClear = ['dashboard'];
      if (payload && payload.table) {
        keysToClear.push('rows:' + payload.table);
        keysToClear.push('map:' + payload.table);
      }
      if (action === 'saveFeriaAttendance' && payload && payload.payload) {
        keysToClear.push('feriaAttendance:' + (payload.payload.feria || '') + ':' + (payload.payload.fecha || ''));
      }
      if (action === 'runExcelBackup' || action === 'toggleDailyBackup') {
        keysToClear.push('listExcelBackups');
        keysToClear.push('bootstrap');
      }
      keysToClear.forEach(function(k) {
        delete memCache[k];
        try { localStorage.removeItem(SWR_PREFIX + k); } catch (e) {}
      });
    }

    window.__clearInspectorLiveCache = function() {
      memCache = {};

        if (payload && payload.table) qs += '&table=' + encodeURIComponent(payload.table);
        if (payload && payload.feria) qs += '&feria=' + encodeURIComponent(payload.feria);
        if (payload && payload.fecha) qs += '&fecha=' + encodeURIComponent(payload.fecha);
        return fetch(LIVE_API_URL + qs, { method: 'GET' }).then(function(r) { return r.json(); });
      }
      return fetch(LIVE_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ action: action }, payload || {}))
      }).then(function(r) { return r.json(); });
    }

    function scheduleBackgroundPrefetch() {
      if (prefetchedOnce || !LIVE_API_URL) return;
      prefetchedOnce = true;
      setTimeout(function() {
        var targets = [
          { action: 'dashboard', payload: null },
          { action: 'rows', payload: { table: 'ASISTENCIA' } }
        ];
        targets.forEach(function(t) {
          var ck = getCacheKey(t.action, t.payload);
          var existing = readCache(ck);
          if (!existing || (Date.now() - existing.ts > 120000)) {
            if (!inFlight[ck]) {
              inFlight[ck] = fetchLiveGasRaw(t.action, t.payload)
                .then(function(res) { writeCache(ck, res); return res; })
                .catch(function() { return null; })
                .finally(function() { delete inFlight[ck]; });
            }
          }
        });
      }, 1200);
    }

    function buildInstantBootstrapShell() {
      return {
        authorized: true,
        isLiveBackend: true,
        user: { email: 'cristopher.maciel@penaflor.cl', isAuthorized: true },
        config: {
          appName: APP_CONFIG.APP_NAME,
          subtitle: APP_CONFIG.SUBTITLE,
          creator: APP_CONFIG.CREATOR,
          contact: APP_CONFIG.CONTACT,
          primaryColor: APP_CONFIG.PRIMARY_COLOR
        },
        schemas: TABLE_SCHEMAS,
        viewMap: APPSHEET_VIEW_MAP,
        funcionarios: [],
        navTables: {},
        driveFolders: {},
        dailyBackupEnabled: false
      };
    }

    function callLiveGas(action, payload) {
      var isRead = (action === 'bootstrap' || action === 'rows' || action === 'dashboard' || action === 'map' || action === 'listExcelBackups' || action === 'feriaAttendance');
      if (!isRead) {
        invalidateCacheForWrite(action, payload);
        return fetchLiveGasRaw(action, payload);
      }

      var ck = getCacheKey(action, payload);
      var cached = readCache(ck);
      var staleMs = (action === 'bootstrap') ? 300000 : 60000;

      function refreshInBackground() {
        if (inFlight[ck]) return inFlight[ck];
        inFlight[ck] = fetchLiveGasRaw(action, payload)
          .then(function(res) {
            if (res && !res.error && res.ok !== false) {
              writeCache(ck, res);
              if (action === 'bootstrap' && window.App && App.applyLiveBootstrapUpdate) {
                App.applyLiveBootstrapUpdate(res);
              }
            }
            return res;
          })
          .finally(function() { delete inFlight[ck]; });
        return inFlight[ck];
      }

      // 1) Si hay caché: respuesta INSTANTÁNEA (0 ms) + revalidación silenciosa si está vencida
      if (cached && cached.data) {
        if (Date.now() - cached.ts > staleMs) {
          refreshInBackground().catch(function() {});
        }
        if (action === 'bootstrap') scheduleBackgroundPrefetch();
        return Promise.resolve(cached.data);
      }

      // 2) Arranque en frío de bootstrap: pinta la UI en < 10 ms y sincroniza en vivo detrás
      if (action === 'bootstrap') {
        refreshInBackground().then(function() { scheduleBackgroundPrefetch(); }).catch(function() {});
        return Promise.resolve(buildInstantBootstrapShell());
      }

      // 3) Lectura en vivo con deduplicación
      return refreshInBackground();
    }

    var DELTA_KEY = 'inspector_comercial_deltas_v3';
    var baseDbPromise = null;
    var cachedDb = null;

    function loadDeltas() {
      try {
        var raw = localStorage.getItem(DELTA_KEY);
        if (raw) return JSON.parse(raw);
      } catch(e) {}
      return { added: {}, edited: {}, deleted: {} };
    }
    function saveDeltas(d) {
      try { localStorage.setItem(DELTA_KEY, JSON.stringify(d)); } catch(e) {}
    }

    function getDbAsync() {
      if (cachedDb) return Promise.resolve(cachedDb);
      if (!baseDbPromise) {
        baseDbPromise = fetch('./data/initial-data.json?v=3')
          .then(function(r) { return r.json(); })
          .catch(function() { return {}; })
          .then(function(data) {
            cachedDb = data || {};
            return cachedDb;
          });
      }
      return baseDbPromise;
    }

    function getMergedRows(db, tableName) {
      var baseRows = (db[tableName] || []).slice();
      var deltas = loadDeltas();
      var delSet = deltas.deleted[tableName] || {};
      var editMap = deltas.edited[tableName] || {};
      var addedArr = deltas.added[tableName] || [];

      var merged = baseRows
        .filter(function(r) { return !delSet[r._RowNumber]; })
        .map(function(r) { return editMap[r._RowNumber] ? Object.assign({}, r, editMap[r._RowNumber]) : r; });

      return addedArr.concat(merged);
    }

    var localServer = {
      apiGetBootstrap: function() {
        return getDbAsync().then(function(db) {
          var funcs = getMergedRows(db, 'FUNCIONARIO');
          return {
            authorized: true,
            user: { email: 'cristopher.maciel@penaflor.cl (Datos Reales Cargados)', isAuthorized: true },
            config: { appName: APP_CONFIG.APP_NAME, subtitle: APP_CONFIG.SUBTITLE, creator: APP_CONFIG.CREATOR, contact: APP_CONFIG.CONTACT, primaryColor: APP_CONFIG.PRIMARY_COLOR },
            schemas: TABLE_SCHEMAS,
            viewMap: APPSHEET_VIEW_MAP,
            funcionarios: funcs.map(function(f){ return { id: f.ID || '', nombre: f.NOMBRE || '', rol: f.ROL || '', imagen: f.IMAGEN || '' }; }).filter(function(f){ return f.nombre; }),
            navTables: {
              MENU: getMergedRows(db, 'MENU'),
              SUBMENU: getMergedRows(db, 'SUBMENU'),
              'SUBMENU 2': getMergedRows(db, 'SUBMENU 2'),
              'SUBMENU 3': getMergedRows(db, 'SUBMENU 3'),
              LISTADOS: getMergedRows(db, 'LISTADOS'),
              'FERIAS LIBRES': getMergedRows(db, 'FERIAS LIBRES'),
              DOCUMENTOS: getMergedRows(db, 'DOCUMENTOS')
            },
            driveFolders: {
              root: { url: 'https://drive.google.com/drive/folders/1ktunuY-vFv5wjz_qIlmsaGJEZL80Euw5?usp=drive_link' },
              fotos: { url: 'https://drive.google.com/drive/folders/1ktunuY-vFv5wjz_qIlmsaGJEZL80Euw5?usp=drive_link' },
              firmas: { url: 'https://drive.google.com/drive/folders/1ktunuY-vFv5wjz_qIlmsaGJEZL80Euw5?usp=drive_link' },
              pdfs: { url: 'https://drive.google.com/drive/folders/1ktunuY-vFv5wjz_qIlmsaGJEZL80Euw5?usp=drive_link' },
              excel: { url: 'https://drive.google.com/drive/folders/1ktunuY-vFv5wjz_qIlmsaGJEZL80Euw5?usp=drive_link' }
            },
            dailyBackupEnabled: true
          };
        });
      },
      apiGetTableRows: function(tableName) {
        return getDbAsync().then(function(db) {
          var rows = getMergedRows(db, tableName);
          var schema = TABLE_SCHEMAS[tableName] || { columns: [] };
          var summary = {};
          if (tableName === 'PATENTES EN MORA') {
            summary.totalPatentesMorosas = rows.reduce(function(acc, r) {
              var est = String(r['ESTADO PATENTE'] || '').trim().toUpperCase();
              var val = Number(String(r['VALOR PATENTE'] || '0').replace(/[^0-9.-]/g, '')) || 0;
              return est === 'EN MORA' ? acc + val : acc;
            }, 0);
          }
          return { tableName: tableName, headers: schema.columns.map(function(c){ return c.name; }), rows: rows, summary: summary };
        });
      },
      apiSaveRecord: function(tableName, recordData) {
        return getDbAsync().then(function() {
          var deltas = loadDeltas();
          if (recordData._RowNumber) {
            deltas.edited[tableName] = deltas.edited[tableName] || {};
            deltas.edited[tableName][recordData._RowNumber] = recordData;
          } else {
            deltas.added[tableName] = deltas.added[tableName] || [];
            recordData._RowNumber = 900000 + deltas.added[tableName].length + 1;
            if (!recordData.ID) recordData.ID = Math.random().toString(16).slice(2, 10);
            if (!recordData['FECHA HORA']) recordData['FECHA HORA'] = new Date().toLocaleString('es-CL');
            deltas.added[tableName].unshift(recordData);
          }
          saveDeltas(deltas);
          return { ok: true, isEdit: Boolean(recordData._RowNumber < 900000), record: recordData, pdf: null };
        });
      },
      apiDeleteRecord: function(tableName, rowNumber) {
        return getDbAsync().then(function() {
          var deltas = loadDeltas();
          deltas.deleted[tableName] = deltas.deleted[tableName] || {};
          deltas.deleted[tableName][rowNumber] = true;
          if (deltas.added[tableName]) {
            deltas.added[tableName] = deltas.added[tableName].filter(function(r){ return Number(r._RowNumber) !== Number(rowNumber); });
          }
          saveDeltas(deltas);
          return { ok: true };
        });
      },
      apiRegeneratePdf: function() { return Promise.resolve({ ok: true, pdf: { url: 'https://drive.google.com/drive/folders/1ktunuY-vFv5wjz_qIlmsaGJEZL80Euw5?usp=drive_link' } }); },
      apiGetDashboardStats: function() {
        return getDbAsync().then(function(db) {
          var comercio = getMergedRows(db, 'COMERCIO');
          var fueraHora = getMergedRows(db, 'FUERA DE HORA');
          var publicidad = getMergedRows(db, 'GIGANTOGRAFIA');
          var mora = getMergedRows(db, 'PATENTES EN MORA');
          var reportes = getMergedRows(db, 'REPORTE');
          var feriantes = getMergedRows(db, 'ASISTENCIA');
          var feriasNavidenas = getMergedRows(db, 'FERIAS NAVIDEÑAS');

          var countBy = function(arr, col) {
            var m = {};
            (arr || []).forEach(function(r){
              var k = String(r[col] || 'Sin especificar').trim() || 'Sin especificar';
              m[k] = (m[k] || 0) + 1;
            });
            return Object.keys(m).map(function(k){ return { label: k, value: m[k] }; }).sort(function(a,b){ return b.value - a.value; });
          };

          var totalMora = 0, moraPorEstado = {};
          mora.forEach(function(r){
            var e = String(r['ESTADO PATENTE'] || 'Sin estado').trim().toUpperCase() || 'SIN ESTADO';
            var v = Number(String(r['VALOR PATENTE'] || '0').replace(/[^0-9.-]/g, '')) || 0;
            moraPorEstado[e] = (moraPorEstado[e] || 0) + v;
            if (e === 'EN MORA') totalMora += v;
          });

          return {
            kpis: {
              totalComercio: comercio.length,
              totalFueraHora: fueraHora.length,
              totalPublicidad: publicidad.length,
              totalMoraCount: mora.length,
              totalMoraMonto: Math.round(totalMora),
              totalReportes: reportes.length,
              totalFeriantes: feriantes.length,
              totalFeriasNavidenas: feriasNavidenas.length
            },
            charts: {
              topPublicidad: countBy(publicidad, 'INSPECTOR'),
              topFiscalizador: countBy(comercio, 'INSPECTOR'),
              topFueraHora: countBy(fueraHora, 'INSPECTOR'),
              permisoAlDia: countBy(comercio, 'PERMISO AL DIA'),
              valorPatentesMora: Object.keys(moraPorEstado).map(function(k){ return { label: k, value: Math.round(moraPorEstado[k]) }; }),
              totalesPatentesMora: countBy(mora.map(function(r){ return { 'ESTADO PATENTE': String(r['ESTADO PATENTE'] || 'SIN ESTADO').trim().toUpperCase() }; }), 'ESTADO PATENTE')
            }
          };
        });
      },
      apiGetMapPoints: function(tableName) {
        return getDbAsync().then(function(db) {
          var rows = getMergedRows(db, tableName);
          var pts = [];
          rows.forEach(function(r){
            var m = String(r.UBICACION || r.DIRECCION || '').match(/(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/);
            if (m) pts.push({
              lat: parseFloat(m[1]),
              lng: parseFloat(m[2]),
              title: r['NOMBRE LOCAL'] || r['NOMBRE LOCAL COMERCIAL'] || r['NOMBRE DUEÑO'] || r.FUNCIONARIO || 'Registro',
              subtitle: r.DIRECCION || '',
              inspector: r.INSPECTOR || r.FISCALIZADOR || r.FUNCIONARIO || r['CONTROLADO POR'] || '',
              fecha: r['FECHA HORA'] || r.FECHA || r['FECHA FISCALIZACION'] || ''
            });
          });
          return pts;
        });
      },
      apiRunExcelBackup: function() { return Promise.resolve({ timestamp: new Date().toLocaleString('es-CL'), files: [{ ok: true, name: 'INSPECTOR_COMERCIAL.xlsx' }] }); },
      apiListExcelBackups: function() { return Promise.resolve([]); },
      apiToggleDailyBackup: function(enable) { return Promise.resolve({ ok: true, message: enable ? 'Respaldo diario activado (23:00 hrs).' : 'Respaldo diario desactivado.' }); },
      apiGetFeriaAttendance: function(feria, fecha) {
        var key = 'inspector_feria_att_v3_' + String(feria || '').toUpperCase() + '_' + String(fecha || '');
        var marks = {};
        try { marks = JSON.parse(localStorage.getItem(key) || '{}'); } catch(e) {}
        return Promise.resolve({ feria: feria, fecha: fecha, marks: marks });
      },
      apiSaveFeriaAttendance: function(payload) {
        var feria = String(payload.feria || '').toUpperCase();
        var fecha = String(payload.fecha || new Date().toISOString().slice(0, 10));
        var puesto = Number(payload.puesto);
        var key = 'inspector_feria_att_v3_' + feria + '_' + fecha;
        var marks = {};
        try { marks = JSON.parse(localStorage.getItem(key) || '{}'); } catch(e) {}
        var now = new Date();
        var hora = now.toTimeString().slice(0, 8);
        var mark = {
          idRegistro: (marks[puesto] && marks[puesto].idRegistro) || Math.random().toString(16).slice(2, 10).toUpperCase(),
          fecha: fecha,
          hora: hora,
          feria: feria,
          puesto: puesto,
          idFeriante: payload.idFeriante || '',
          nombre: payload.nombre || '',
          rut: payload.rut || '',
          rol: payload.rol || '',
          patente: payload.patente || '',
          giro: payload.giro || '',
          estado: payload.estado || 'ASISTE',
          medio: payload.medio || 'MANUAL',
          inspector: payload.inspector || '',
          ubicacion: payload.ubicacion || '',
          observaciones: payload.observaciones || ''
        };
        marks[puesto] = mark;
        try { localStorage.setItem(key, JSON.stringify(marks)); } catch(e) {}
        return Promise.resolve({ ok: true, mark: mark });
      }
    };

    var LIVE_MAP = {
      apiGetBootstrap: function() { return callLiveGas('bootstrap'); },
      apiGetTableRows: function(table) { return callLiveGas('rows', { table: table }); },
      apiSaveRecord: function(table, record, mediaUploads) { return callLiveGas('saveRecord', { table: table, record: record, mediaUploads: mediaUploads }); },
      apiDeleteRecord: function(table, rowNumber) { return callLiveGas('deleteRecord', { table: table, rowNumber: rowNumber }); },
      apiRegeneratePdf: function(table, rowNumber) { return callLiveGas('regeneratePdf', { table: table, rowNumber: rowNumber }); },
      apiGetDashboardStats: function() { return callLiveGas('dashboard'); },
      apiGetMapPoints: function(table) { return callLiveGas('map', { table: table }); },
      apiRunExcelBackup: function() { return callLiveGas('runExcelBackup'); },
      apiListExcelBackups: function() { return callLiveGas('listExcelBackups'); },
      apiToggleDailyBackup: function(enable) { return callLiveGas('toggleDailyBackup', { enable: enable }); },
      apiGetFeriaAttendance: function(feria, fecha) { return callLiveGas('feriaAttendance', { feria: feria, fecha: fecha }); },
      apiSaveFeriaAttendance: function(payload) { return callLiveGas('saveFeriaAttendance', { payload: payload }); }
    };

    function makeRunner(okCb, errCb) {
      var runner = {
        withSuccessHandler: function(fn) { return makeRunner(fn, errCb); },
        withFailureHandler: function(fn) { return makeRunner(okCb, fn); }
      };
      Object.keys(localServer).forEach(function(fnName) {
        runner[fnName] = function() {
          var args = Array.prototype.slice.call(arguments);
          var p = (LIVE_API_URL && LIVE_MAP[fnName])
            ? LIVE_MAP[fnName].apply(null, args)
            : localServer[fnName].apply(null, args);
          p.then(function(res) { if (okCb) okCb(res); })
           .catch(function(err) { if (errCb) errCb(err); });
        };
      });
      return runner;
    }

    window.google = { script: { run: makeRunner(null, null) } };
  })();
}
</script>

<script>
/**
 * ============================================================================
 * DEPARTAMENTO DE INSPECTORES COMERCIALES - CONTROLADOR FRONTEND SPA + PWA
 * ============================================================================
 */
const App = {
  boot: null,
  history: [],
  currentRoute: null,
  currentTableData: null,
  mediaUploads: {},
  signaturePads: {},
  chartInstances: [],
  leafletMap: null,
  deferredInstallPrompt: null,
  feriaState: {
    feria: '',
    fecha: new Date().toISOString().slice(0, 10),
    inspector: '',
    filter: 'ALL',
    query: '',
    allAsistenciaRows: [],
    stalls: [],
    marks: {},
    qrScanner: null
  },

  init() {
    this.setupPWA();
    // Cerrar desplegables multi-selección al hacer clic fuera
    document.addEventListener('click', e => {
      if (!e.target.closest('.ms-dropdown')) {
        document.querySelectorAll('.ms-dropdown.open').forEach(el => el.classList.remove('open'));
      }
    });

    this.showLoader('Cargando Departamento de Inspectores Comerciales...');
    google.script.run
      .withSuccessHandler(res => {
        this.hideLoader();
        if (!res || !res.authorized) {
          document.getElementById('appView').innerHTML =
            '<div class="card"><h2>Acceso restringido</h2><p>Tu cuenta (' +
            this.esc(res && res.user ? res.user.email : '') +
            ') no está autorizada para usar esta aplicación.</p></div>';
          return;
        }
        this.boot = res;
        document.getElementById('userEmailLabel').textContent = res.user.email || 'Usuario Municipal';
        this.openTab('menu');
      })
      .withFailureHandler(err => {
        this.hideLoader();
        this.toast('Error al iniciar: ' + err.message);
      })
      .apiGetBootstrap();
  },

  // ==========================================================================
  // PWA INSTALABLE (MÓVIL ANDROID/iOS + ESCRITORIO WINDOWS/MAC)
  // ==========================================================================
  setupPWA() {
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      this.deferredInstallPrompt = e;
      const btn = document.getElementById('btnInstallApp');
      if (btn) btn.style.display = 'inline-flex';
    });
    window.addEventListener('appinstalled', () => {
      this.deferredInstallPrompt = null;
      this.toast('Aplicación instalada correctamente en tu dispositivo.');
    });
  },

  promptInstall() {
    if (this.deferredInstallPrompt) {
      this.deferredInstallPrompt.prompt();
      this.deferredInstallPrompt.userChoice.then(choice => {
        if (choice.outcome === 'accepted') {
          this.toast('Instalando Departamento de Inspectores Comerciales...');
        }
        this.deferredInstallPrompt = null;
      });
      return;
    }

    // Mostrar guía clara para instalar en iPhone/iPad, Android o Escritorio
    document.getElementById('modalTitle').textContent = 'Instalar App (Móvil y Escritorio)';
    document.getElementById('modalBody').innerHTML =
      '<div style="font-size:14px;line-height:1.6;">' +
      '<p>Podés instalar <strong>Departamento de Inspectores Comerciales</strong> como aplicación nativa en tu celular o computador:</p>' +
      '<div class="card" style="margin-bottom:10px;padding:12px;"><strong>📱 Android (Chrome):</strong><br>Tocá el menú <strong>⋮</strong> arriba a la derecha → <strong>"Instalar aplicación"</strong> o <strong>"Agregar a la pantalla principal"</strong>.</div>' +
      '<div class="card" style="margin-bottom:10px;padding:12px;"><strong>🍎 iPhone / iPad (Safari):</strong><br>Tocá el botón <strong>Compartir</strong> (cuadrado con flecha arriba) → <strong>"Agregar a inicio"</strong>.</div>' +
      '<div class="card" style="margin-bottom:0;padding:12px;"><strong>💻 Escritorio (Chrome / Edge):</strong><br>Hacé clic en el ícono de <strong>Instalar (monitor con flecha)</strong> en la barra de direcciones arriba a la derecha.</div>' +
      '</div>';
    document.getElementById('detailModal').classList.add('open');
  },

  // ==========================================================================
  // NAVEGACIÓN
  // ==========================================================================
  openTab(tab) {
    this.history = [];
    document.querySelectorAll('[data-tab]').forEach(el => {
      el.classList.toggle('active', el.getAttribute('data-tab') === tab);
    });

    if (tab === 'menu') {
      this.navigate({ kind: 'menu', table: 'MENU', title: 'Departamento de Inspectores Comerciales' }, false);
    } else if (tab === 'ferias') {
      this.navigate({ kind: 'feriasHub', title: 'Asistencia Ferias Libres (1-100 + QR)' }, false);
    } else if (tab === 'forms') {
      this.navigate({ kind: 'formsHub', title: 'Formularios de Fiscalización' }, false);
    } else if (tab === 'tables') {
      this.navigate({ kind: 'tablesHub', title: 'Listados y Registros Excel' }, false);
    } else if (tab === 'map') {
      this.navigate({ kind: 'map', table: 'COMERCIO', title: 'Mapa de Fiscalizaciones' }, false);
    } else if (tab === 'dashboard') {
      this.navigate({ kind: 'dashboard', title: 'Estadísticas y Dashboard' }, false);
    } else if (tab === 'backup') {
      this.navigate({ kind: 'backup', title: 'Excel, Drive y Conexión en Vivo' }, false);
    }
  },

  navigate(route, pushHistory = true) {
    if (pushHistory && this.currentRoute) {
      this.history.push(this.currentRoute);
    }
    this.currentRoute = route;
    document.getElementById('headerTitle').textContent = route.title || 'Departamento de Inspectores Comerciales';
    document.getElementById('btnBack').classList.toggle('hidden', this.history.length === 0);

    switch (route.kind) {
      case 'menu': this.renderMenuTable(route.table); break;
      case 'feriasHub': this.renderFeriasHub(); break;
      case 'feriaFicha': this.renderFeriaFicha(route.feria); break;
      case 'formsHub': this.renderFormsHub(); break;
      case 'tablesHub': this.renderTablesHub(); break;
      case 'form': this.renderForm(route.table, route.record || null); break;
      case 'table': this.renderTable(route.table); break;
      case 'links': this.renderDocumentLinks(); break;
      case 'map': this.renderMap(route.table || 'COMERCIO'); break;
      case 'dashboard': this.renderDashboard(); break;
      case 'backup': this.renderBackupPanel(); break;
      default: this.renderMenuTable('MENU');
    }
  },

  goBack() {
    if (this.history.length === 0) return;
    const prev = this.history.pop();
    this.navigate(prev, false);
  },

  refreshCurrent() {
    if (!this.currentRoute) return;
    if (window.__clearInspectorLiveCache) window.__clearInspectorLiveCache();
    this.navigate(this.currentRoute, false);
    this.toast('Sincronizando datos en vivo...');
  },

  applyLiveBootstrapUpdate(data) {
    if (!data || !data.authorized) return;
    this.boot = data;
    const lbl = document.getElementById('userEmailLabel');
    if (lbl && data.user && data.user.email) lbl.textContent = data.user.email;
    if (this.currentRoute && this.currentRoute.kind === 'backup') {
      this.renderBackupPanel();
    }
  },

  openAppSheetViewName(viewName) {
    const mapped = this.boot.viewMap[viewName];

  renderForm(tableName, existingRecord) {
    const schema = this.boot.schemas[tableName];
    const isEdit = Boolean(existingRecord && existingRecord._RowNumber);
    this.mediaUploads = {};
    this.signaturePads = {};

    const orderedColNames = schema.formColumns || schema.columns.map(c => c.name);
    const colMap = {};
    schema.columns.forEach(c => colMap[c.name] = c);

    let fieldsHtml = '';
    orderedColNames.forEach(colName => {
      const col = colMap[colName];
      if (!col || col.hiddenInForm || col.readOnly) return;

      const label = col.displayName || col.name;
      const val = existingRecord && existingRecord[col.name] !== undefined ? existingRecord[col.name] : '';
      const fieldId = 'fld_' + col.name.replace(/[^a-zA-Z0-9]/g, '_');

      let inputHtml = '';
      let extraClass = '';

      if (col.type === 'Ref' && col.refTable === 'FUNCIONARIO') {
        inputHtml = '<select class="form-control" data-col="' + this.esc(col.name) + '"><option value="">-- Seleccionar Inspector --</option>';
        (this.boot.funcionarios || []).forEach(f => {
          const sel = String(val) === String(f.nombre) ? ' selected' : '';
          inputHtml += '<option value="' + this.esc(f.nombre) + '"' + sel + '>' + this.esc(f.nombre) + (f.rol ? ' (' + this.esc(f.rol) + ')' : '') + '</option>';
        });
        inputHtml += '</select>';
      } else if (col.type === 'Enum') {
        inputHtml = '<select class="form-control" data-col="' + this.esc(col.name) + '"><option value="">-- Seleccionar opción --</option>';
        (col.values || []).forEach(opt => {
          const sel = String(val).toUpperCase() === String(opt).toUpperCase() ? ' selected' : '';
          inputHtml += '<option value="' + this.esc(opt) + '"' + sel + '>' + this.esc(opt) + '</option>';
        });
        inputHtml += '</select>';
      } else if (col.type === 'EnumList') {
        // DESPLEGABLE CON SELECCIÓN MÚLTIPLE + BUSCADOR + CHECKBOXES
        const selectedArr = String(val || '').split(',').map(s => s.trim()).filter(Boolean);
        inputHtml = this._renderMultiSelectDropdown(fieldId, col.name, col.values || [], selectedArr);
      } else if (col.type === 'LongText') {
        extraClass = 'full-width';
        inputHtml = '<textarea class="form-control" data-col="' + this.esc(col.name) + '">' + this.esc(val) + '</textarea>';
      } else if (col.type === 'Location') {
        inputHtml = '<div class="loc-row">' +

          '<button type="button" class="btn btn-outline btn-sm" onclick="App.captureGPS(\'' + fieldId + '\')" title="Capturar GPS"><span class="material-icons">my_location</span></button>' +
          '</div>';
      } else if (col.type === 'Image') {
        inputHtml = '<div class="photo-box">' +
          '<input type="file" accept="image/*" capture="environment" onchange="App.handlePhotoSelect(this, \'' + this.escJs(col.name) + '\', \'' + fieldId + '_prev\')">' +
          '<img id="' + fieldId + '_prev" class="photo-preview" src="' + (val && String(val).startsWith('http') ? this.esc(val) : '') + '" style="' + (val && String(val).startsWith('http') ? 'display:inline-block;' : '') + '">' +
          '</div>';
      } else if (col.type === 'Signature') {
        extraClass = 'full-width';
        inputHtml = '<canvas id="' + fieldId + '_sig" class="sig-pad" data-sig-col="' + this.esc(col.name) + '"></canvas>' +
          '<div style="margin-top:6px;display:flex;justify-content:flex-end;">' +
          '<button type="button" class="btn btn-outline btn-sm" onclick="App.clearSignature(\'' + fieldId + '_sig\')">Limpiar Firma</button>' +
          '</div>';
      } else if (col.type === 'Number' || col.type === 'Price') {
        inputHtml = '<input type="number" step="any" class="form-control" data-col="' + this.esc(col.name) + '" value="' + this.esc(val) + '">';
      } else if (col.type === 'Date') {
        inputHtml = '<input type="date" class="form-control" data-col="' + this.esc(col.name) + '" value="' + this.esc(val) + '">';
      } else if (col.type === 'Email') {
        inputHtml = '<input type="email" class="form-control" data-col="' + this.esc(col.name) + '" value="' + this.esc(val) + '">';
      } else if (col.type === 'Phone') {
        inputHtml = '<input type="tel" class="form-control" data-col="' + this.esc(col.name) + '" value="' + this.esc(val) + '">';
      } else if (col.type === 'Url') {
        inputHtml = '<input type="url" class="form-control" data-col="' + this.esc(col.name) + '" value="' + this.esc(val) + '">';
      } else {
        inputHtml = '<input type="text" class="form-control" data-col="' + this.esc(col.name) + '" value="' + this.esc(val) + '">';
      }

      fieldsHtml += '<div class="form-field ' + extraClass + '"><label>' + this.esc(label) + '</label>' + inputHtml + '</div>';

      '</div>' +
      '<form id="dynamicForm" class="card" onsubmit="App.submitForm(event, \'' + this.escJs(tableName) + '\', ' + (isEdit ? Number(existingRecord._RowNumber) : 'null') + ', \'' + this.escJs(isEdit ? (existingRecord[schema.keyCol] || '') : '') + '\')">' +

  _renderMultiSelectDropdown(fieldId, colName, values, selectedArr) {
    let tagsHtml = '';
    if (selectedArr.length === 0) {
      tagsHtml = '<span class="ms-placeholder">Seleccionar una o varias opciones...</span>';
    } else {
      selectedArr.forEach(v => {
        tagsHtml += '<span class="ms-tag">' + this.esc(v) + '</span>';
      });
    }

    let optsHtml = '';
    values.forEach(opt => {
      const checked = selectedArr.indexOf(opt) !== -1 ? ' checked' : '';
      optsHtml += '<label class="ms-opt" style="text-transform:none;font-weight:400;margin:0;letter-spacing:0;">' +
        '<input type="checkbox" value="' + this.esc(opt) + '"' + checked + ' onchange="App.syncMultiSelect(\'' + fieldId + '\')">' +
        '<span>' + this.esc(opt) + '</span></label>';
    });

    return '<div class="ms-dropdown" id="ms_' + fieldId + '" data-enumlist="' + this.esc(colName) + '">' +
      '<div class="ms-trigger" onclick="App.toggleMultiSelect(\'' + fieldId + '\')">' +
      '<div class="ms-tags" id="ms_tags_' + fieldId + '" style="display:flex;flex-wrap:wrap;gap:5px;">' + tagsHtml + '</div>' +
      '<span class="material-icons ms-arrow">expand_more</span>' +
      '</div>' +
      '<div class="ms-panel">' +
      '<input type="text" class="ms-search" placeholder="Filtrar opciones..." oninput="App.filterMultiSelect(\'' + fieldId + '\', this.value)">' +
      '<div class="ms-actions">' +
      '<button type="button" onclick="App.setAllMultiSelect(\'' + fieldId + '\', true)">Seleccionar todas</button>' +
      '<button type="button" onclick="App.setAllMultiSelect(\'' + fieldId + '\', false)">Limpiar</button>' +
      '<button type="button" onclick="App.toggleMultiSelect(\'' + fieldId + '\')">Listo ✓</button>' +
      '</div>' +
      '<div class="ms-options" id="ms_opts_' + fieldId + '">' + optsHtml + '</div>' +
      '</div></div>';
  },

  toggleMultiSelect(fieldId) {
    const el = document.getElementById('ms_' + fieldId);
    if (!el) return;
    const wasOpen = el.classList.contains('open');
    document.querySelectorAll('.ms-dropdown.open').forEach(d => d.classList.remove('open'));
    if (!wasOpen) el.classList.add('open');
  },

  filterMultiSelect(fieldId, query) {
    const q = (query || '').toLowerCase();
    document.querySelectorAll('#ms_opts_' + fieldId + ' .ms-opt').forEach(opt => {
      const txt = opt.textContent.toLowerCase();
      opt.style.display = txt.indexOf(q) !== -1 ? 'flex' : 'none';
    });
  },

  setAllMultiSelect(fieldId, state) {
    document.querySelectorAll('#ms_opts_' + fieldId + ' input[type="checkbox"]').forEach(cb => {
      if (cb.closest('.ms-opt').style.display !== 'none') cb.checked = state;
    });
    this.syncMultiSelect(fieldId);
  },

  syncMultiSelect(fieldId) {
    const box = document.getElementById('ms_tags_' + fieldId);
    if (!box) return;
    const vals = Array.from(document.querySelectorAll('#ms_opts_' + fieldId + ' input[type="checkbox"]:checked')).map(c => c.value);
    if (vals.length === 0) {
      box.innerHTML = '<span class="ms-placeholder">Seleccionar una o varias opciones...</span>';
    } else {
      box.innerHTML = vals.map(v => '<span class="ms-tag">' + this.esc(v) + '</span>').join('');
    }
  },

  captureGPS(inputId) {
    if (!navigator.geolocation) {
      this.toast('Tu navegador no soporta GPS.');
      return;
    }
    this.toast('Obteniendo ubicación GPS...');
    navigator.geolocation.getCurrentPosition(
      pos => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        const coords = lat.toFixed(6) + ', ' + lng.toFixed(6);
        document.getElementById(inputId).value = coords;
        const q = this.detectQuadrant(lat, lng);
        const qMsg = q ? (' · 📍 Cuadrante ' + q.id + ' (' + q.unidad + ')') : ' · Fuera de geocerca Peñaflor';
        this.toast('Ubicación capturada: ' + coords + qMsg);
      },
      err => this.toast('Error GPS: ' + err.message),
      { enableHighAccuracy: true, timeout: 10000 }
    );
  },

  handlePhotoSelect(input, colName, previewId) {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 1280;
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const compressed = canvas.toDataURL('image/jpeg', 0.78);
        this.mediaUploads[colName] = compressed;
        const prev = document.getElementById(previewId);
        if (prev) {
          prev.src = compressed;
          prev.style.display = 'inline-block';
        }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  },

  initSignaturePads() {
    document.querySelectorAll('canvas.sig-pad').forEach(canvas => {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width || 500;
      canvas.height = 170;
      const ctx = canvas.getContext('2d');
      ctx.lineWidth = 2.4;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#101828';

      let drawing = false;
      let hasInk = false;

      const getPos = e => {
        const r = canvas.getBoundingClientRect();
        const t = e.touches ? e.touches[0] : e;
        return { x: (t.clientX - r.left) * (canvas.width / r.width), y: (t.clientY - r.top) * (canvas.height / r.height) };
      };

      const start = e => { drawing = true; hasInk = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); };
      const move = e => { if (!drawing) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); };
      const end = () => { drawing = false; };

      canvas.addEventListener('mousedown', start);
      canvas.addEventListener('mousemove', move);
      window.addEventListener('mouseup', end);
      canvas.addEventListener('touchstart', start, { passive: false });
      canvas.addEventListener('touchmove', move, { passive: false });
      canvas.addEventListener('touchend', end);

      this.signaturePads[canvas.id] = {
        col: canvas.getAttribute('data-sig-col'),
        canvas,
        hasInk: () => hasInk,
        clear: () => { ctx.clearRect(0, 0, canvas.width, canvas.height); hasInk = false; }
      };
    });
  },

  clearSignature(canvasId) {
    if (this.signaturePads[canvasId]) this.signaturePads[canvasId].clear();
  },

  submitForm(event, tableName, rowNumber, existingKey) {
    event.preventDefault();
    const form = document.getElementById('dynamicForm');
    const schema = this.boot.schemas[tableName];
    const record = {};

    if (rowNumber) record._RowNumber = rowNumber;
    if (existingKey && schema.keyCol && schema.keyCol !== '_RowNumber') {
      record[schema.keyCol] = existingKey;
    }

    form.querySelectorAll('[data-col]').forEach(el => {
      record[el.getAttribute('data-col')] = el.value;
    });

    // Leer todos los desplegables multi-selección
    form.querySelectorAll('[data-enumlist]').forEach(group => {
      const col = group.getAttribute('data-enumlist');
      const selected = Array.from(group.querySelectorAll('input[type="checkbox"]:checked')).map(c => c.value);
      record[col] = selected.join(' , ');
    });

    Object.keys(this.signaturePads).forEach(id => {
      const pad = this.signaturePads[id];
      if (pad.hasInk()) {
        this.mediaUploads[pad.col] = pad.canvas.toDataURL('image/png');
      }
    });

    this.showLoader('Guardando datos en orden exacto en Excel/Sheets y Drive...');
    google.script.run
      .withSuccessHandler(res => {
        this.hideLoader();
        if (res && res.ok) {
          let msg = res.isEdit ? 'Registro actualizado en la planilla.' : 'Registro guardado en orden exacto en la planilla.';
          if (res.pdf && res.pdf.url) msg += ' PDF generado automáticamente.';
          this.toast(msg);
          this.navigate({ kind: 'table', table: tableName, title: schema.label });
        }
      })
      .withFailureHandler(err => {
        this.hideLoader();
        this.toast('Error al guardar: ' + err.message);
      })
      .apiSaveRecord(tableName, record, this.mediaUploads);
  },

  // ==========================================================================
  // VISTAS DE TABLA / LISTADOS + EXPORTACIÓN EXCEL .XLSX EN ORDEN EXACTO
  // ==========================================================================
  renderTable(tableName) {
    const schema = this.boot.schemas[tableName];
    this.showLoader('Cargando ' + schema.label + '...');
    google.script.run
      .withSuccessHandler(data => {
        this.hideLoader();
        this.currentTableData = data;
        this._paintTable(tableName, data, '');
      })
      .withFailureHandler(err => {
        this.hideLoader();
        this.toast('Error cargando tabla: ' + err.message);
      })
      .apiGetTableRows(tableName);
  },

  _paintTable(tableName, data, query) {
    const schema = this.boot.schemas[tableName];
    const cols = schema.tableColumns || schema.columns.slice(0, 6).map(c => c.name);
    const q = (query || '').toLowerCase();

    const filtered = (data.rows || []).filter(r => {
      if (!q) return true;
      return Object.values(r).some(v => String(v || '').toLowerCase().indexOf(q) !== -1);
    });

    let summaryBanner = '';
    if (tableName === 'PATENTES EN MORA' && data.summary) {
      summaryBanner = '<div class="kpi-grid"><div class="kpi-card">' +
        '<div class="kpi-label">TOTAL DE PATENTES MOROSAS</div>' +
        '<div class="kpi-value">$' + Number(data.summary.totalPatentesMorosas || 0).toLocaleString('es-CL') + '</div>' +
        '</div><div class="kpi-card">' +
        '<div class="kpi-label">REGISTROS TOTALES</div>' +
        '<div class="kpi-value">' + filtered.length + '</div>' +
        '</div></div>';
    }

    let html = '<div class="section-header">' +
      '<h2>' + this.esc(schema.label) + ' <span class="badge badge-blue">' + filtered.length + '</span></h2>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
      '<button class="btn btn-success btn-sm" onclick="App.exportCurrentTableXLSX(\'' + this.escJs(tableName) + '\')"><span class="material-icons" style="font-size:16px;">table_view</span> Descargar Excel (.xlsx)</button>' +
      '<button class="btn btn-primary btn-sm" onclick="App.navigate({kind:\'form\',table:\'' + this.escJs(tableName) + '\',title:\'' + this.escJs(schema.label) + '\'})"><span class="material-icons" style="font-size:16px;">add</span> NUEVO</button>' +
      '</div></div>' +
      summaryBanner +
      '<div class="toolbar">' +
      '<input type="search" class="form-control search-input" placeholder="Buscar por local, RUT, inspector, dirección..." value="' + this.esc(query) + '" oninput="App._paintTable(\'' + this.escJs(tableName) + '\', App.currentTableData, this.value)">' +
      '</div>';

    if (filtered.length === 0) {
      html += '<div class="card" style="text-align:center;color:var(--muted);">No se encontraron registros.</div>';
    } else {
      html += '<div class="table-wrap"><table class="data-table"><thead><tr>';
      cols.forEach(c => html += '<th>' + this.esc(c) + '</th>');
      html += '<th>ACCIONES</th></tr></thead><tbody>';

      filtered.slice(0, 1000).forEach(r => {
        html += '<tr>';
        cols.forEach(c => {
          const val = r[c] !== undefined ? r[c] : '';
          if (c === 'PDF' && String(val).startsWith('http')) {
            html += '<td><a class="badge badge-green" href="' + this.esc(val) + '" target="_blank">Abrir PDF</a></td>';
          } else if (c === 'ESTADO PATENTE' || c === 'CUENTA CON PATENTE' || c === 'PERMISO AL DIA') {
            const up = String(val).toUpperCase();
            const cls = (up === 'SI' || up === 'AL DIA') ? 'badge-green' : (up === 'NO' || up === 'EN MORA' || up === 'VENCIDO') ? 'badge-red' : 'badge-amber';
            html += '<td><span class="badge ' + cls + '">' + this.esc(val || '-') + '</span></td>';
          } else {
            html += '<td>' + this.esc(String(val).substring(0, 60)) + '</td>';
          }
        });
        html += '<td style="white-space:nowrap;">' +
          '<button class="btn btn-outline btn-sm" onclick="App.openDetailModal(\'' + this.escJs(tableName) + '\',' + r._RowNumber + ')">Ver</button> ' +
          '<button class="btn btn-outline btn-sm" onclick="App.editRow(\'' + this.escJs(tableName) + '\',' + r._RowNumber + ')">Editar</button>' +
          '</td></tr>';
      });
      html += '</tbody></table></div>';
    }

    document.getElementById('appView').innerHTML = html;
  },

  editRow(tableName, rowNumber) {
    const row = (this.currentTableData.rows || []).find(r => Number(r._RowNumber) === Number(rowNumber));
    if (!row) return;
    const schema = this.boot.schemas[tableName];
    this.navigate({ kind: 'form', table: tableName, title: 'Editar ' + schema.label, record: row });
  },

  openDetailModal(tableName, rowNumber) {
    const row = (this.currentTableData.rows || []).find(r => Number(r._RowNumber) === Number(rowNumber));
    if (!row) return;
    const schema = this.boot.schemas[tableName];

    document.getElementById('modalTitle').textContent = schema.label + ' — ' + (row[schema.labelCol] || row.ID || '#' + rowNumber);
    let body = '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;">';
    if (row['TELEFONO']) body += '<a class="btn btn-outline btn-sm" href="tel:' + this.esc(row['TELEFONO']) + '">📞 Llamar</a>';
    if (row['EMAIL']) body += '<a class="btn btn-outline btn-sm" href="mailto:' + this.esc(row['EMAIL']) + '">✉️ Correo</a>';
    if (row['UBICACION']) body += '<a class="btn btn-outline btn-sm" target="_blank" href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(row['UBICACION']) + '">📍 Ver Mapa</a>';
    if (row['PDF'] && String(row['PDF']).startsWith('http')) {
      body += '<a class="btn btn-success btn-sm" target="_blank" href="' + this.esc(row['PDF']) + '">📄 Abrir PDF</a>';
    }
    if (schema.hasPdfBot) {
      body += '<button class="btn btn-primary btn-sm" onclick="App.regeneratePdf(\'' + this.escJs(tableName) + '\',' + rowNumber + ')">🔄 Generar PDF</button>';
    }
    body += '<button class="btn btn-danger btn-sm" onclick="App.deleteRow(\'' + this.escJs(tableName) + '\',' + rowNumber + ')">🗑️ Eliminar</button></div>';

    schema.columns.forEach(col => {
      const val = row[col.name];
      if (val === undefined || val === null || val === '') return;
      let valHtml = this.esc(val);
      if ((col.type === 'Image' || col.type === 'Signature' || col.type === 'File' || col.type === 'Url') && String(val).startsWith('http')) {
        valHtml = '<a href="' + this.esc(val) + '" target="_blank" style="color:var(--accent);font-weight:600;">Abrir archivo en Drive ↗</a>';
      }
      body += '<div class="detail-row"><strong>' + this.esc(col.displayName || col.name) + '</strong><span>' + valHtml + '</span></div>';
    });

    document.getElementById('modalBody').innerHTML = body;
    document.getElementById('detailModal').classList.add('open');
  },

  closeModal() {
    this.stopQrScanner();
    document.getElementById('detailModal').classList.remove('open');
  },

  regeneratePdf(tableName, rowNumber) {
    this.showLoader('Generando informe PDF en Drive...');
    google.script.run
      .withSuccessHandler(res => {
        this.hideLoader();
        this.closeModal();
        this.toast('PDF generado y guardado en Drive.');
        if (res && res.pdf && res.pdf.url) window.open(res.pdf.url, '_blank');
        this.renderTable(tableName);
      })
      .withFailureHandler(err => {
        this.hideLoader();

  deleteRow(tableName, rowNumber) {
    if (!confirm('¿Seguro que deseas borrar este registro?')) return;
    this.showLoader('Eliminando registro...');
    google.script.run
      .withSuccessHandler(() => {
        this.hideLoader();
        this.closeModal();

        this.renderTable(tableName);
      })
      .withFailureHandler(err => {
        this.hideLoader();

      })

  /**
   * Exporta la tabla actual como archivo real Excel (.xlsx) en el orden exacto de columnas.
   */
  exportCurrentTableXLSX(tableName) {
    if (!this.currentTableData || !this.currentTableData.rows) return;
    const schema = this.boot.schemas[tableName];
    const headers = schema ? schema.columns.map(c => c.name) : this.currentTableData.headers;
    const rows = this.currentTableData.rows;

    if (typeof XLSX !== 'undefined') {
      const aoa = [headers];
      rows.forEach(r => {
        aoa.push(headers.map(h => r[h] !== undefined && r[h] !== null ? r[h] : ''));
      });
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      XLSX.utils.book_append_sheet(wb, ws, tableName.substring(0, 31));
      XLSX.writeFile(wb, tableName.replace(/\s+/g, '_') + '_' + new Date().toISOString().slice(0, 10) + '.xlsx');
      this.toast('Archivo Excel (.xlsx) descargado con orden exacto de columnas.');
    } else {
      const csvLines = [headers.map(h => '"' + String(h).replace(/"/g, '""') + '"').join(';')];
      rows.forEach(r => {
        csvLines.push(headers.map(h => '"' + String(r[h] || '').replace(/"/g, '""') + '"').join(';'));
      });
      const blob = new Blob(['\uFEFF' + csvLines.join('\n')], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = tableName.replace(/\s+/g, '_') + '_' + new Date().toISOString().slice(0, 10) + '.csv';
      a.click();
    }
  },

  getQuadrants() {
    try {
      const saved = localStorage.getItem('INSPECTOR_CUSTOM_QUADRANTS_V1');
      if (saved) {
        const arr = JSON.parse(saved);
        if (Array.isArray(arr) && arr.length > 0) return arr;
      }
    } catch (e) {}
    return this._getDefaultQuadrants();
  },

  _pointInPolygon(lat, lng, poly) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const xi = poly[i][0], yi = poly[i][1];
      const xj = poly[j][0], yj = poly[j][1];
      const intersect = ((yi > lng) !== (yj > lng)) &&
        (lat < (xj - xi) * (lng - yi) / ((yj - yi) || 1e-12) + xi);
      if (intersect) inside = !inside;
    }
    return inside;
  },

  detectQuadrant(lat, lng) {
    const la = Number(lat), ln = Number(lng);
    if (isNaN(la) || isNaN(ln)) return null;
    const qs = this.getQuadrants();
    for (let i = 0; i < qs.length; i++) {
      if (qs[i].polygon && qs[i].polygon.length >= 3 && this._pointInPolygon(la, ln, qs[i].polygon)) {
        return qs[i];
      }
    }
    return null;
  },

  _polygonCentroid(poly) {
    let latSum = 0, lngSum = 0;
    poly.forEach(p => { latSum += p[0]; lngSum += p[1]; });
    return [latSum / poly.length, lngSum / poly.length];
  },

    });

    const hasCustom = Boolean(localStorage.getItem('INSPECTOR_CUSTOM_QUADRANTS_V1'));
    this.mapState = {

        if (this.leafletMap) { this.leafletMap.remove(); this.leafletMap = null; }
        this.leafletMap = L.map('mapContainer').setView([-33.6085, -70.8880], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {

        this.mapState.geofenceLayer = L.layerGroup().addTo(this.leafletMap);

        this._renderQuadrantControlsAndLayers();

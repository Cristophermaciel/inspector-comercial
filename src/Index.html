    </div>
    <button id="btnInstallApp" class="install-pill" onclick="App.promptInstall()" title="Instalar en celular o escritorio">
      <span class="material-icons">install_mobile</span>

    </button>
    <button class="icon-btn" onclick="App.refreshCurrent()" title="Sincronizar">

      </button>
      <button class="sidebar-item" data-tab="forms" onclick="App.openTab('forms')">

      </button>
      <button class="sidebar-item" data-tab="ferias" onclick="App.openTab('ferias')">

      </button>
      <button class="sidebar-item" data-tab="tables" onclick="App.openTab('tables')">

      </button>
      <button class="sidebar-item" data-tab="map" onclick="App.openTab('map')">

      </button>
      <button class="sidebar-item" data-tab="dashboard" onclick="App.openTab('dashboard')">
        <span class="material-icons">bar_chart</span> Estadísticas / Dashboard
      </button>
      <div class="sidebar-divider"></div>
      <button class="sidebar-item" data-tab="backup" onclick="App.openTab('backup')">

        <div>CREADOR CRISTOPHER MACIEL</div>

        <button class="btn btn-outline btn-sm" onclick="App.closeModal()">Cerrar</button>
      </div>

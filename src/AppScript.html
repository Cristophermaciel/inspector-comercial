<script>
/**
 * ============================================================================
 * DEPARTAMENTO DE INSPECTORES COMERCIALES - CONTROLADOR FRONTEND SPA + PWA
 * ============================================================================
 */
const App = {
  boot: null,
  history: [],
  currentRoute: null,
  currentTableData: null,
  deudasSort: 'demora_asc',
  mediaUploads: {},
  signaturePads: {},
  chartInstances: [],
  leafletMap: null,
  deferredInstallPrompt: null,
  feriaState: {
    feria: '',
    fecha: new Date().toISOString().slice(0, 10),
    inspector: '',
    inspectorAcompanante: [],
    filter: 'ALL',
    query: '',
    allAsistenciaRows: [],
    stalls: [],
    marks: {},
    qrScanner: null
  },

  init() {
    this.setupPWA();
    // Cerrar desplegables multi-selección al hacer clic fuera
    document.addEventListener('click', e => {
      if (!e.target.closest('.ms-dropdown')) {
        document.querySelectorAll('.ms-dropdown.open').forEach(el => el.classList.remove('open'));
      }
    });

    this.showLoader('Cargando Departamento de Inspectores Comerciales...');
    google.script.run
      .withSuccessHandler(res => {
        this.hideLoader();
        if (!res || !res.authorized) {
          document.getElementById('appView').innerHTML =
            '<div class="card"><h2>Acceso restringido</h2><p>Tu cuenta (' +
            this.esc(res && res.user ? res.user.email : '') +
            ') no está autorizada para usar esta aplicación.</p></div>';
          return;
        }
        this.boot = res;
        document.getElementById('userEmailLabel').textContent = res.user.email || 'Usuario Municipal';
        this.openTab('menu');
      })
      .withFailureHandler(err => {
        this.hideLoader();
        this.toast('Error al iniciar: ' + err.message);
      })
      .apiGetBootstrap();
  },

  // ==========================================================================
  // PWA INSTALABLE (MÓVIL ANDROID/iOS + ESCRITORIO WINDOWS/MAC)
  // ==========================================================================
  setupPWA() {
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      this.deferredInstallPrompt = e;
      const btn = document.getElementById('btnInstallApp');
      if (btn) btn.style.display = 'inline-flex';
    });
    window.addEventListener('appinstalled', () => {
      this.deferredInstallPrompt = null;
      this.toast('Aplicación instalada correctamente en tu dispositivo.');
    });
  },

  promptInstall() {
    if (this.deferredInstallPrompt) {
      this.deferredInstallPrompt.prompt();
      this.deferredInstallPrompt.userChoice.then(choice => {
        if (choice.outcome === 'accepted') {
          this.toast('Instalando Departamento de Inspectores Comerciales...');
        }
        this.deferredInstallPrompt = null;
      });
      return;
    }

    // Mostrar guía clara para instalar en iPhone/iPad, Android o Escritorio
    document.getElementById('modalTitle').textContent = 'Instalar App (Móvil y Escritorio)';
    document.getElementById('modalBody').innerHTML =
      '<div style="font-size:14px;line-height:1.6;">' +
      '<p>Podés instalar <strong>Departamento de Inspectores Comerciales</strong> como aplicación nativa en tu celular o computador:</p>' +
      '<div class="card" style="margin-bottom:10px;padding:12px;"><strong>📱 Android (Chrome):</strong><br>Tocá el menú <strong>⋮</strong> arriba a la derecha → <strong>"Instalar aplicación"</strong> o <strong>"Agregar a la pantalla principal"</strong>.</div>' +
      '<div class="card" style="margin-bottom:10px;padding:12px;"><strong>🍎 iPhone / iPad (Safari):</strong><br>Tocá el botón <strong>Compartir</strong> (cuadrado con flecha arriba) → <strong>"Agregar a inicio"</strong>.</div>' +
      '<div class="card" style="margin-bottom:0;padding:12px;"><strong>💻 Escritorio (Chrome / Edge):</strong><br>Hacé clic en el ícono de <strong>Instalar (monitor con flecha)</strong> en la barra de direcciones arriba a la derecha.</div>' +
      '</div>';
    document.getElementById('detailModal').classList.add('open');
  },

  // ==========================================================================
  // NAVEGACIÓN
  // ==========================================================================
  openTab(tab) {
    this.history = [];
    document.querySelectorAll('[data-tab]').forEach(el => {
      el.classList.toggle('active', el.getAttribute('data-tab') === tab);
    });

    if (tab === 'menu') {
      this.navigate({ kind: 'menu', table: 'MENU', title: 'Departamento de Inspectores Comerciales' }, false);
    } else if (tab === 'ferias') {
      this.navigate({ kind: 'feriasHub', title: 'Asistencia Ferias Libres (1-100 + QR)' }, false);
    } else if (tab === 'forms') {
      this.navigate({ kind: 'formsHub', title: 'Formularios de Fiscalización' }, false);
    } else if (tab === 'tables') {
      this.navigate({ kind: 'tablesHub', title: 'Listados y Registros Excel' }, false);
    } else if (tab === 'map') {
      this.navigate({ kind: 'map', table: 'COMERCIO', title: 'Mapa de Fiscalizaciones' }, false);
    } else if (tab === 'dashboard') {
      this.navigate({ kind: 'dashboard', title: 'Estadísticas y Dashboard' }, false);
    } else if (tab === 'backup') {
      this.navigate({ kind: 'backup', title: 'Excel, Drive y Conexión en Vivo' }, false);
    }
  },

  navigate(route, pushHistory = true) {
    if (pushHistory && this.currentRoute) {
      this.history.push(this.currentRoute);
    }
    this.currentRoute = route;
    document.getElementById('headerTitle').textContent = route.title || 'Departamento de Inspectores Comerciales';
    document.getElementById('btnBack').classList.toggle('hidden', this.history.length === 0);

    switch (route.kind) {
      case 'menu': this.renderMenuTable(route.table); break;
      case 'feriasHub': this.renderFeriasHub(); break;
      case 'feriaFicha': this.renderFeriaFicha(route.feria); break;
      case 'formsHub': this.renderFormsHub(); break;
      case 'tablesHub': this.renderTablesHub(); break;
      case 'form': this.renderForm(route.table, route.record || null); break;
      case 'table': this.renderTable(route.table); break;
      case 'links': this.renderDocumentLinks(); break;
      case 'map': this.renderMap(route.table || 'COMERCIO'); break;
      case 'dashboard': this.renderDashboard(); break;
      case 'backup': this.renderBackupPanel(); break;
      default: this.renderMenuTable('MENU');
    }
  },

  goBack() {
    if (this.history.length === 0) return;
    const prev = this.history.pop();
    this.navigate(prev, false);
  },

  refreshCurrent() {
    if (!this.currentRoute) return;
    if (window.__clearInspectorLiveCache) window.__clearInspectorLiveCache();
    this.navigate(this.currentRoute, false);
    this.toast('Sincronizando datos en vivo...');
  },

  applyLiveBootstrapUpdate(data) {
    if (!data || !data.authorized) return;
    this.boot = data;
    const lbl = document.getElementById('userEmailLabel');
    if (lbl && data.user && data.user.email) lbl.textContent = data.user.email;
    if (this.currentRoute && this.currentRoute.kind === 'backup') {
      this.renderBackupPanel();
    }
  },

  openAppSheetViewName(viewName) {
    const mapped = this.boot.viewMap[viewName];
    if (mapped) {
      this.navigate(Object.assign({}, mapped));
      return;
    }
    if (this.boot.schemas[viewName]) {
      this.navigate({ kind: 'table', table: viewName, title: this.boot.schemas[viewName].label || viewName });
      return;
    }
    this.toast('Vista "' + viewName + '" no mapeada todavía.');
  },

  isLiveConnected() {
    return Boolean(window.__GAS_LIVE_CONNECTED__ || (this.boot && this.boot.isLiveBackend));
  },

  // ==========================================================================
  // VISTAS DE MENÚ
  // ==========================================================================
  _getMenuIconMeta(label) {
    const u = String(label || '').toUpperCase();
    if (u.indexOf('FISCALIZ') !== -1) return { icon: 'fact_check', cls: 'ic-blue' };
    if (u.indexOf('REPORT') !== -1) return { icon: 'assignment_turned_in', cls: 'ic-indigo' };
    if (u.indexOf('DOCUMENT') !== -1 || u.indexOf('DRIVE') !== -1) return { icon: 'folder_open', cls: 'ic-green' };
    if (u.indexOf('MOROS') !== -1 || u.indexOf('PATENT') !== -1) return { icon: 'payments', cls: 'ic-amber' };
    if (u.indexOf('DASHBOARD') !== -1 || u.indexOf('DHASBOARD') !== -1) return { icon: 'monitoring', cls: 'ic-blue' };
    if (u.indexOf('UBICAC') !== -1 || u.indexOf('MAP') !== -1) return { icon: 'pin_drop', cls: 'ic-sky' };
    if (u.indexOf('LISTA') !== -1) return { icon: 'table_view', cls: 'ic-teal' };
    if (u.indexOf('FERIA') !== -1) return { icon: 'storefront', cls: 'ic-green' };
    if (u.indexOf('PUBLICIDAD') !== -1 || u.indexOf('GIGANTO') !== -1) return { icon: 'campaign', cls: 'ic-cyan' };
    if (u.indexOf('HORA') !== -1) return { icon: 'dark_mode', cls: 'ic-indigo' };
    if (u.indexOf('NAVID') !== -1) return { icon: 'redeem', cls: 'ic-red' };
    return { icon: 'widgets', cls: 'ic-blue' };
  },

  renderMenuTable(tableName) {
    const rows = (this.boot.navTables && this.boot.navTables[tableName]) || [];
    const schema = this.boot.schemas[tableName] || {};
    const labelKey = schema.keyCol || 'ID MENU';

    let html = '';
    if (tableName === 'MENU') {
      const live = this.isLiveConnected();
      html += '<div class="dept-hero">' +
        '<div class="dept-hero-left">' +
        '<img class="dept-hero-logo" src="https://cristophermaciel.github.io/inspector-comercial/assets/logo-penaflor.jpg" onerror="this.src=\'./assets/logo-penaflor.jpg\'" alt="Logo Peñaflor">' +
        '<div><h2>Departamento de Inspectores Comerciales</h2><p>Dirección de Seguridad Pública — Ilustre Municipalidad de Peñaflor</p></div>' +
        '</div>' +
        '<div class="conn-badge ' + (live ? 'live' : 'demo') + '" onclick="App.openTab(\'backup\')">' +
        '<span class="material-icons" style="font-size:17px;">' + (live ? 'cloud_done' : 'cloud_sync') + '</span>' +
        (live ? 'Conectado en Vivo a Google Sheets & Drive' : 'Datos Cargados — Conectar Google Sheets') +
        '</div></div>';
    } else {
      html += '<div class="section-header"><h2>' + this.esc(this.currentRoute.title) + '</h2></div>';
    }

    if (tableName !== 'MENU' && rows.length > 0) {
      html += '<div class="gallery-grid" style="margin-bottom:22px;">';
      rows.forEach(r => {
        const title = r[labelKey] || r['VISTA'] || 'Opción';
        const vista = r['VISTA'] || '';
        const img = r['IMAGEN'] || '';
        const meta = this._getMenuIconMeta(title + ' ' + vista);
        const imgHtml = img && String(img).startsWith('http')
          ? '<img class="card-thumb" src="' + this.esc(img) + '" alt="">'
          : '<div class="card-icon ' + meta.cls + '"><span class="material-icons">' + meta.icon + '</span></div>';

        html += '<div class="menu-card" onclick="App.openAppSheetViewName(\'' + this.escJs(vista) + '\')">' +
          imgHtml + '<div class="card-title">' + this.esc(title) + '</div></div>';
      });
      html += '</div>';
    }

    if (tableName === 'MENU') {
      html += '<div class="section-header"><h2>Módulos de Fiscalización y Gestión</h2></div>';
      html += this._buildQuickCardsHtml();
    }

    document.getElementById('appView').innerHTML = html;
  },

  _buildQuickCardsHtml() {
    const quick = [
      { title: 'Fis. Comercial', sub: 'Comercio establecido', icon: 'storefront', cls: 'ic-blue', route: { kind: 'form', table: 'COMERCIO', title: 'Fiscalización Comercial' } },
      { title: 'Fis. Fuera de Horario', sub: 'Control nocturno', icon: 'dark_mode', cls: 'ic-indigo', route: { kind: 'form', table: 'FUERA DE HORA', title: 'Fiscalización Fuera de Horario' } },
      { title: 'Fis. Publicidad', sub: 'Gigantografías', icon: 'campaign', cls: 'ic-cyan', route: { kind: 'form', table: 'GIGANTOGRAFIA', title: 'Fiscalización Publicidad' } },
      { title: 'Patentes en Mora', sub: 'Cobro y seguimiento', icon: 'payments', cls: 'ic-amber', route: { kind: 'form', table: 'PATENTES EN MORA', title: 'Patentes en Mora' } },
      { title: 'Reporte a Jefatura', sub: 'Informes y PDF', icon: 'assignment_turned_in', cls: 'ic-blue', route: { kind: 'form', table: 'REPORTE', title: 'Reporte a Jefatura' } },
      { title: 'Registro Feria Libre', sub: 'Padrón feriantes', icon: 'local_mall', cls: 'ic-green', route: { kind: 'form', table: 'ASISTENCIA', title: 'Registro Feria Libre' } },
      { title: 'Asistencia Ferias QR', sub: 'Puestos 1 al 100', icon: 'qr_code_scanner', cls: 'ic-teal', route: { kind: 'feriasHub', title: 'Asistencia Ferias Libres (1-100 + QR)' } },
      { title: 'Semana Peñaflorina', sub: 'Control evento', icon: 'celebration', cls: 'ic-purple', route: { kind: 'form', table: 'SEMANA PEÑAFLORINA', title: 'Semana Peñaflorina' } },
      { title: 'Ferias Navideñas', sub: 'Control navideño', icon: 'redeem', cls: 'ic-red', route: { kind: 'form', table: 'FERIAS NAVIDEÑAS', title: 'Ferias Navideñas' } },
      { title: 'Notif. por Deudas', sub: 'Plazos y vencimientos', icon: 'notifications_active', cls: 'ic-rose', route: { kind: 'table', table: 'Hoja 1', title: 'Notificaciones por Deudas' } },
      { title: 'Mapa Fiscalizaciones', sub: 'Geolocalización GPS', icon: 'pin_drop', cls: 'ic-sky', route: { kind: 'map', table: 'COMERCIO', title: 'Mapa de Fiscalizaciones' } },
      { title: 'Estadísticas / Dashboard', sub: 'KPIs y gráficos', icon: 'monitoring', cls: 'ic-blue', route: { kind: 'dashboard', title: 'Estadísticas y Dashboard' } },
      { title: 'Documentos Drive', sub: 'Carpetas oficiales', icon: 'folder_open', cls: 'ic-green', route: { kind: 'links', table: 'DOCUMENTOS', title: 'Documentos Drive' } },
      { title: 'Excel y Drive', sub: 'Respaldo .xlsx y API', icon: 'cloud_sync', cls: 'ic-teal', route: { kind: 'backup', title: 'Excel, Drive y Conexión en Vivo' } }
    ];

    let html = '<div class="gallery-grid">';
    quick.forEach(q => {
      html += '<div class="menu-card" onclick=\'App.navigate(' + JSON.stringify(q.route) + ')\'>' +
        '<div class="card-icon ' + q.cls + '"><span class="material-icons">' + q.icon + '</span></div>' +
        '<div class="card-title">' + this.esc(q.title) + '</div>' +
        '<div class="card-sub">' + this.esc(q.sub) + '</div>' +
        '</div>';
    });
    html += '</div>';
    return html;
  },

  renderFormsHub() {
    const formTables = ['COMERCIO', 'FUERA DE HORA', 'GIGANTOGRAFIA', 'PATENTES EN MORA', 'REPORTE', 'ASISTENCIA', 'SEMANA PEÑAFLORINA', 'FERIAS NAVIDEÑAS', 'Hoja 1', 'FUNCIONARIO'];
    let html = '<div class="section-header"><h2>Formularios de Ingreso</h2></div><div class="gallery-grid">';
    formTables.forEach(t => {
      const s = this.boot.schemas[t];
      html += '<div class="menu-card" onclick="App.navigate({kind:\'form\',table:\'' + this.escJs(t) + '\',title:\'' + this.escJs(s.label) + '\'})">' +
        '<div class="card-icon"><span class="material-icons">' + (s.icon || 'edit_note') + '</span></div>' +
        '<div class="card-title">' + this.esc(s.label) + '</div>' +
        (s.hasPdfBot ? '<span class="badge badge-blue">Auto PDF + Excel</span>' : '<span class="badge badge-blue">Excel</span>') +
        '</div>';
    });
    html += '</div>';
    document.getElementById('appView').innerHTML = html;
  },

  renderTablesHub() {
    const dataTables = ['COMERCIO', 'FUERA DE HORA', 'GIGANTOGRAFIA', 'PATENTES EN MORA', 'REPORTE', 'ASISTENCIA', 'SEMANA PEÑAFLORINA', 'FERIAS NAVIDEÑAS', 'Hoja 1', 'FUNCIONARIO', 'DOCUMENTOS'];
    let html = '<div class="section-header"><h2>Listados y Planillas Excel</h2></div><div class="gallery-grid">';
    dataTables.forEach(t => {
      const s = this.boot.schemas[t];
      html += '<div class="menu-card" onclick="App.navigate({kind:\'table\',table:\'' + this.escJs(t) + '\',title:\'' + this.escJs(s.label) + '\'})">' +
        '<div class="card-icon"><span class="material-icons">' + (s.icon || 'table_rows') + '</span></div>' +
        '<div class="card-title">' + this.esc(s.label) + '</div>' +
        '</div>';
    });
    html += '</div>';
    document.getElementById('appView').innerHTML = html;
  },

  renderDocumentLinks() {
    const rows = (this.boot.navTables && this.boot.navTables['DOCUMENTOS']) || [];
    let html = '<div class="section-header"><h2>Documentos y Enlaces Drive</h2>' +
      '<button class="btn btn-primary btn-sm" onclick="App.navigate({kind:\'form\',table:\'DOCUMENTOS\',title:\'Nuevo Enlace Drive\'})">+ Agregar enlace</button>' +
      '</div><div class="gallery-grid">';
    if (rows.length === 0) {
      html += '<div class="card" style="grid-column:1/-1;">No hay enlaces registrados en la hoja DOCUMENTOS.</div>';
    } else {
      rows.forEach(r => {
        html += '<a class="menu-card" style="text-decoration:none;" href="' + this.esc(r['LINK'] || '#') + '" target="_blank">' +
          '<div class="card-icon"><span class="material-icons">open_in_new</span></div>' +
          '<div class="card-title">' + this.esc(r['IR'] || 'Documento') + '</div></a>';
      });
    }
    html += '</div>';
    document.getElementById('appView').innerHTML = html;
  },

  // ==========================================================================
  // LISTADO DE INSPECTORES (SIN EQUIPO + INCLUYE TAMARA MARTINEZ)
  // ==========================================================================
  getInspectorsList() {
    const fallback = [
      { nombre: 'Luis Zamorano Vásquez', rol: 'Inspector Comercial' },
      { nombre: 'JHON NAVARRETE', rol: 'INSPECTOR' },
      { nombre: 'SERGIO OYARCE', rol: 'INSPECTOR' },
      { nombre: 'ENRIQUE RODRIGUEZ', rol: 'INSPECTOR' },
      { nombre: 'NICOLAS ZAMORANO', rol: 'INSPECTOR' },
      { nombre: 'LEONARDO VALENZUELA', rol: 'INSPECTOR' },
      { nombre: 'LEONARDO HERRERA', rol: 'INSPECTOR' },
      { nombre: 'PATRICIO CANCINO', rol: 'INSPECTOR' },
      { nombre: 'TAMARA MARTINEZ', rol: 'INSPECTOR' }
    ];
    const norm = s => String(s || '')
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .toUpperCase().replace(/\s+/g, ' ').trim();

    const out = [];
    const seen = {};
    const add = (f) => {
      const nombre = String((f && (f.nombre || f.NOMBRE)) || '').trim();
      const rol = String((f && (f.rol || f.ROL)) || '').trim();
      if (!nombre) return;
      if (/EQUIPO/i.test(rol) || /EQUIPO/i.test(nombre)) return;
      const key = norm(nombre);
      if (seen[key]) return;
      seen[key] = true;
      out.push({ nombre, rol: rol || 'INSPECTOR' });
    };

    ((this.boot && this.boot.funcionarios) || []).forEach(add);
    fallback.forEach(add);
    return out;
  },

  // ==========================================================================
  // FORMULARIO DINÁMICO (DESPLEGABLES SIMPLES + DESPLEGABLES MULTI-SELECCIÓN)
  // ==========================================================================
  renderForm(tableName, existingRecord) {
    const schema = this.boot.schemas[tableName];
    const isEdit = Boolean(existingRecord && existingRecord._RowNumber);
    this.mediaUploads = {};
    this.signaturePads = {};

    const orderedColNames = schema.formColumns || schema.columns.map(c => c.name);
    const colMap = {};
    schema.columns.forEach(c => colMap[c.name] = c);

    const inspectors = this.getInspectorsList();

    let fieldsHtml = '';
    orderedColNames.forEach(colName => {
      const col = colMap[colName];
      if (!col || col.hiddenInForm || col.readOnly) return;

      const label = col.displayName || col.name;
      const val = existingRecord && existingRecord[col.name] !== undefined ? existingRecord[col.name] : '';
      const fieldId = 'fld_' + col.name.replace(/[^a-zA-Z0-9]/g, '_');

      let inputHtml = '';
      let extraClass = '';

      if (col.type === 'Ref' && col.refTable === 'FUNCIONARIO') {
        inputHtml = '<select class="form-control" data-col="' + this.esc(col.name) + '"><option value="">-- Seleccionar Inspector a Cargo --</option>';
        let matched = false;
        inspectors.forEach(f => {
          const isSel = String(val).trim().toUpperCase() === String(f.nombre).trim().toUpperCase();
          if (isSel) matched = true;
          const sel = isSel ? ' selected' : '';
          inputHtml += '<option value="' + this.esc(f.nombre) + '"' + sel + '>' + this.esc(f.nombre) + (f.rol ? ' (' + this.esc(f.rol) + ')' : '') + '</option>';
        });
        if (val && !matched) {
          inputHtml += '<option value="' + this.esc(val) + '" selected>' + this.esc(val) + '</option>';
        }
        inputHtml += '</select>';
      } else if (col.type === 'RefList' && col.refTable === 'FUNCIONARIO') {
        const selectedArr = String(val || '').split(',').map(s => s.trim()).filter(Boolean);
        const inspectorOpts = inspectors.map(f => ({
          value: f.nombre,
          label: f.nombre + (f.rol ? ' (' + f.rol + ')' : '')
        }));
        inputHtml = this._renderMultiSelectDropdown(
          fieldId,
          col.name,
          inspectorOpts,
          selectedArr,
          'Seleccionar uno o varios inspectores acompañantes...'
        );
      } else if (col.type === 'Enum') {
        inputHtml = '<select class="form-control" data-col="' + this.esc(col.name) + '"><option value="">-- Seleccionar opción --</option>';
        (col.values || []).forEach(opt => {
          const sel = String(val).toUpperCase() === String(opt).toUpperCase() ? ' selected' : '';
          inputHtml += '<option value="' + this.esc(opt) + '"' + sel + '>' + this.esc(opt) + '</option>';
        });
        inputHtml += '</select>';
      } else if (col.type === 'EnumList') {
        // DESPLEGABLE CON SELECCIÓN MÚLTIPLE + BUSCADOR + CHECKBOXES
        const selectedArr = String(val || '').split(',').map(s => s.trim()).filter(Boolean);
        inputHtml = this._renderMultiSelectDropdown(fieldId, col.name, col.values || [], selectedArr);
      } else if (col.type === 'LongText') {
        extraClass = 'full-width';
        inputHtml = '<textarea class="form-control" data-col="' + this.esc(col.name) + '">' + this.esc(val) + '</textarea>';
      } else if (col.type === 'Location') {
        inputHtml = '<div class="loc-row">' +
          '<input type="text" class="form-control" id="' + fieldId + '" data-col="' + this.esc(col.name) + '" value="' + this.esc(val) + '" placeholder="-33.6063, -70.8764">' +
          '<button type="button" class="btn btn-outline btn-sm" onclick="App.captureGPS(\'' + fieldId + '\')" title="Capturar GPS"><span class="material-icons">my_location</span></button>' +
          '</div>';
      } else if (col.type === 'Image') {
        inputHtml = '<div class="photo-box">' +
          '<input type="file" accept="image/*" capture="environment" onchange="App.handlePhotoSelect(this, \'' + this.escJs(col.name) + '\', \'' + fieldId + '_prev\')">' +
          '<img id="' + fieldId + '_prev" class="photo-preview" src="' + (val && String(val).startsWith('http') ? this.esc(val) : '') + '" style="' + (val && String(val).startsWith('http') ? 'display:inline-block;' : '') + '">' +
          '</div>';
      } else if (col.type === 'Signature') {
        extraClass = 'full-width';
        inputHtml = '<canvas id="' + fieldId + '_sig" class="sig-pad" data-sig-col="' + this.esc(col.name) + '"></canvas>' +

  _renderMultiSelectDropdown(fieldId, colName, values, selectedArr, placeholder, onChangeCallback) {

      const optVal = typeof opt === 'object' && opt !== null ? opt.value : opt;
      const optLabel = typeof opt === 'object' && opt !== null ? (opt.label || opt.value) : opt;

  captureGPS(inputId) {
    if (!navigator.geolocation) {
      this.toast('Tu navegador no soporta GPS.');
      return;
    }
    this.toast('Obteniendo ubicación GPS...');
    navigator.geolocation.getCurrentPosition(
      pos => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        const coords = lat.toFixed(6) + ', ' + lng.toFixed(6);
        document.getElementById(inputId).value = coords;
        const q = this.detectQuadrant(lat, lng);
        const qMsg = q ? (' · 📍 Cuadrante ' + q.id + ' (' + q.unidad + ')') : ' · Fuera de geocerca Peñaflor';
        this.toast('Ubicación capturada: ' + coords + qMsg);
      },
      err => this.toast('Error GPS: ' + err.message),
      { enableHighAccuracy: true, timeout: 10000 }
    );
  },

  handlePhotoSelect(input, colName, previewId) {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 1280;
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const compressed = canvas.toDataURL('image/jpeg', 0.78);
        this.mediaUploads[colName] = compressed;
        const prev = document.getElementById(previewId);
        if (prev) {
          prev.src = compressed;
          prev.style.display = 'inline-block';
        }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  },

  initSignaturePads() {
    document.querySelectorAll('canvas.sig-pad').forEach(canvas => {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width || 500;
      canvas.height = 170;
      const ctx = canvas.getContext('2d');
      ctx.lineWidth = 2.4;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#101828';

      let drawing = false;
      let hasInk = false;

      const getPos = e => {
        const r = canvas.getBoundingClientRect();
        const t = e.touches ? e.touches[0] : e;
        return { x: (t.clientX - r.left) * (canvas.width / r.width), y: (t.clientY - r.top) * (canvas.height / r.height) };
      };

      const start = e => { drawing = true; hasInk = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); };
      const move = e => { if (!drawing) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); };
      const end = () => { drawing = false; };

      canvas.addEventListener('mousedown', start);
      canvas.addEventListener('mousemove', move);
      window.addEventListener('mouseup', end);
      canvas.addEventListener('touchstart', start, { passive: false });
      canvas.addEventListener('touchmove', move, { passive: false });
      canvas.addEventListener('touchend', end);

      this.signaturePads[canvas.id] = {
        col: canvas.getAttribute('data-sig-col'),
        canvas,
        hasInk: () => hasInk,
        clear: () => { ctx.clearRect(0, 0, canvas.width, canvas.height); hasInk = false; }
      };
    });
  },

  clearSignature(canvasId) {
    if (this.signaturePads[canvasId]) this.signaturePads[canvasId].clear();
  },

  submitForm(event, tableName, rowNumber, existingKey) {
    event.preventDefault();
    const form = document.getElementById('dynamicForm');
    const schema = this.boot.schemas[tableName];
    const record = {};

    if (rowNumber) record._RowNumber = rowNumber;
    if (existingKey && schema.keyCol && schema.keyCol !== '_RowNumber') {
      record[schema.keyCol] = existingKey;
    }

    form.querySelectorAll('[data-col]').forEach(el => {
      record[el.getAttribute('data-col')] = el.value;
    });

    // Leer todos los desplegables multi-selección
    form.querySelectorAll('[data-enumlist]').forEach(group => {
      const col = group.getAttribute('data-enumlist');
      const selected = Array.from(group.querySelectorAll('input[type="checkbox"]:checked')).map(c => c.value);
      record[col] = selected.join(' , ');
    });

    Object.keys(this.signaturePads).forEach(id => {
      const pad = this.signaturePads[id];
      if (pad.hasInk()) {
        this.mediaUploads[pad.col] = pad.canvas.toDataURL('image/png');
      }
    });

    this.showLoader('Guardando datos en orden exacto en Excel/Sheets y Drive...');
    google.script.run
      .withSuccessHandler(res => {
        this.hideLoader();
        if (res && res.ok) {
          let msg = res.isEdit ? 'Registro actualizado en la planilla.' : 'Registro guardado en orden exacto en la planilla.';
          if (res.pdf && res.pdf.url) msg += ' PDF generado automáticamente.';
          this.toast(msg);
          this.navigate({ kind: 'table', table: tableName, title: schema.label });
        }
      })
      .withFailureHandler(err => {
        this.hideLoader();
        this.toast('Error al guardar: ' + err.message);
      })
      .apiSaveRecord(tableName, record, this.mediaUploads);
  },

  renderTable(tableName) {
    const schema = this.boot.schemas[tableName];
    this.showLoader('Cargando ' + schema.label + '...');

      .apiGetTableRows(tableName);
  },

  _parseDateValue(val) {
    if (!val) return NaN;
    if (val instanceof Date) return val.getTime();
    const s = String(val).trim();
    const dmy = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
    const ymd = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
    if (dmy) return new Date(Number(dmy[3]), Number(dmy[2]) - 1, Number(dmy[1])).getTime();
    if (ymd) return new Date(Number(ymd[1]), Number(ymd[2]) - 1, Number(ymd[3])).getTime();
    const parsed = Date.parse(s);
    return isNaN(parsed) ? NaN : parsed;
  },

  _parseDiasRestantes(row) {
    if (!row) return null;
    const raw = row['DIAS RESTANTES'];
    if (raw !== '' && raw !== null && raw !== undefined && !isNaN(Number(raw))) {
      return Math.round(Number(raw));
    }
    const ts = this._parseDateValue(row['FECHA DE TERMINO']);
    if (!isNaN(ts)) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const target = new Date(ts);
      target.setHours(0, 0, 0, 0);
      return Math.round((target.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
    }
    return null;
  },

  _sortDeudasRows(rows, mode) {
    const arr = (rows || []).slice();
    const sortMode = mode || 'demora_asc';
    const numNotif = r => {
      const n = Number(String(r['N° NOTIFICACION'] || '').replace(/[^0-9.-]/g, ''));
      return isNaN(n) ? Number.MAX_SAFE_INTEGER : n;
    };

    arr.sort((a, b) => {
      if (sortMode === 'num_asc') {
        return numNotif(a) - numNotif(b);
      }
      if (sortMode === 'fecha_asc') {
        const ta = this._parseDateValue(a['FECHA DE TERMINO']);
        const tb = this._parseDateValue(b['FECHA DE TERMINO']);
        if (isNaN(ta) && isNaN(tb)) return numNotif(a) - numNotif(b);
        if (isNaN(ta)) return 1;
        if (isNaN(tb)) return -1;
        return ta !== tb ? ta - tb : (numNotif(a) - numNotif(b));
      }

      const da = this._parseDiasRestantes(a);
      const db = this._parseDiasRestantes(b);
      if (da === null && db === null) return numNotif(a) - numNotif(b);
      if (da === null) return 1;
      if (db === null) return -1;

      if (sortMode === 'demora_desc') {
        // Más atrasados primero (-60, -15, -2, 0, 1, 5, 10)
        return da !== db ? da - db : (numNotif(a) - numNotif(b));
      }

      // Default 'demora_asc': Vencidos ordenados de menor a mayor días de demora (1 día, 2 días, 5 días...), luego Vence Hoy (0), luego Vigentes (1, 2, 5...)
      const groupA = da < 0 ? 0 : (da === 0 ? 1 : 2);
      const groupB = db < 0 ? 0 : (db === 0 ? 1 : 2);
      if (groupA !== groupB) return groupA - groupB;
      if (groupA === 0) {
        const demA = Math.abs(da);
        const demB = Math.abs(db);
        return demA !== demB ? demA - demB : (numNotif(a) - numNotif(b));
      }
      return da !== db ? da - db : (numNotif(a) - numNotif(b));
    });
    return arr;
  },

  _paintTable(tableName, data, query) {
    const schema = this.boot.schemas[tableName];
    const cols = schema.tableColumns || schema.columns.slice(0, 6).map(c => c.name);
    const q = (query || '').toLowerCase();

    let filtered = (data.rows || []).filter(r => {
      if (!q) return true;
      return Object.values(r).some(v => String(v || '').toLowerCase().indexOf(q) !== -1);
    });

    if (tableName === 'Hoja 1') {
      filtered = this._sortDeudasRows(filtered, this.deudasSort);
    }

    let summaryBanner = '';
    if (tableName === 'PATENTES EN MORA' && data.summary) {
      summaryBanner = '<div class="kpi-grid"><div class="kpi-card">' +
        '<div class="kpi-label">TOTAL DE PATENTES MOROSAS</div>' +
        '<div class="kpi-value">$' + Number(data.summary.totalPatentesMorosas || 0).toLocaleString('es-CL') + '</div>' +
        '</div><div class="kpi-card">' +
        '<div class="kpi-label">REGISTROS TOTALES</div>' +
        '<div class="kpi-value">' + filtered.length + '</div>' +
        '</div></div>';
    } else if (tableName === 'Hoja 1') {
      let vencidos = 0, vencenHoy = 0, vigentes = 0;
      filtered.forEach(r => {
        const d = this._parseDiasRestantes(r);
        if (d === null) return;
        if (d < 0) vencidos++;
        else if (d === 0) vencenHoy++;
        else vigentes++;
      });
      summaryBanner = '<div class="kpi-grid">' +
        '<div class="kpi-card" style="border-top-color:var(--danger);"><div class="kpi-label">VENCIDOS POR NO PAGO</div><div class="kpi-value" style="color:var(--danger);">' + vencidos + '</div></div>' +
        '<div class="kpi-card" style="border-top-color:var(--warning);"><div class="kpi-label">VENCEN HOY</div><div class="kpi-value" style="color:var(--warning);">' + vencenHoy + '</div></div>' +
        '<div class="kpi-card" style="border-top-color:var(--success);"><div class="kpi-label">EN PLAZO / VIGENTES</div><div class="kpi-value" style="color:var(--success);">' + vigentes + '</div></div>' +
        '<div class="kpi-card"><div class="kpi-label">TOTAL NOTIFICACIONES</div><div class="kpi-value">' + filtered.length + '</div></div>' +
        '</div>';
    }

    let sortControlHtml = '';
    if (tableName === 'Hoja 1') {
      const m = this.deudasSort || 'demora_asc';
      sortControlHtml = '<select class="form-control" style="max-width:340px;" onchange="App.deudasSort=this.value;App._paintTable(\'Hoja 1\', App.currentTableData, \'' + this.escJs(query || '') + '\')">' +
        '<option value="demora_asc"' + (m === 'demora_asc' ? ' selected' : '') + '>Orden: Días de demora (Menor a Mayor)</option>' +
        '<option value="demora_desc"' + (m === 'demora_desc' ? ' selected' : '') + '>Orden: Días de demora (Mayor a Menor)</option>' +
        '<option value="num_asc"' + (m === 'num_asc' ? ' selected' : '') + '>Orden: N° Notificación (Menor a Mayor)</option>' +
        '<option value="fecha_asc"' + (m === 'fecha_asc' ? ' selected' : '') + '>Orden: Fecha de Término (Más próxima)</option>' +
        '</select>';
    }

    let html = '<div class="section-header">' +
      '<h2>' + this.esc(schema.label) + ' <span class="badge badge-blue">' + filtered.length + '</span></h2>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
      '<button class="btn btn-success btn-sm" onclick="App.exportCurrentTableXLSX(\'' + this.escJs(tableName) + '\')"><span class="material-icons" style="font-size:16px;">table_view</span> Descargar Excel (.xlsx)</button>' +
      '<button class="btn btn-primary btn-sm" onclick="App.navigate({kind:\'form\',table:\'' + this.escJs(tableName) + '\',title:\'' + this.escJs(schema.label) + '\'})"><span class="material-icons" style="font-size:16px;">add</span> NUEVO</button>' +
      '</div></div>' +
      summaryBanner +
      '<div class="toolbar">' +
      '<input type="search" class="form-control search-input" placeholder="Buscar por local, RUT, inspector, dirección..." value="' + this.esc(query) + '" oninput="App._paintTable(\'' + this.escJs(tableName) + '\', App.currentTableData, this.value)">' +
      sortControlHtml +
      '</div>';

    if (filtered.length === 0) {
      html += '<div class="card" style="text-align:center;color:var(--muted);">No se encontraron registros.</div>';
    } else {
      const colMap = {};
      (schema.columns || []).forEach(c => colMap[c.name] = c);
      html += '<div class="table-wrap"><table class="data-table"><thead><tr>';
      cols.forEach(c => {
        const hdr = c === 'INSPECTOR ACOMPAÑANTE'
          ? 'INSPECTOR ACOMPAÑANTE'
          : ((colMap[c] && colMap[c].displayName) || c);
        html += '<th>' + this.esc(hdr) + '</th>';
      });
      html += '<th>ACCIONES</th></tr></thead><tbody>';

      filtered.slice(0, 1000).forEach(r => {
        html += '<tr>';
        cols.forEach(c => {
          const val = r[c] !== undefined ? r[c] : '';
          if (c === 'PDF' && String(val).startsWith('http')) {
            html += '<td><a class="badge badge-green" href="' + this.esc(val) + '" target="_blank">Abrir PDF</a></td>';
          } else if (c === 'DIAS RESTANTES' && tableName === 'Hoja 1') {
            const d = this._parseDiasRestantes(r);
            if (d === null) {
              html += '<td><span class="badge badge-amber">Sin fecha</span></td>';
            } else if (d < 0) {
              const dem = Math.abs(d);
              html += '<td><span class="badge badge-red">VENCIDO · ' + dem + ' ' + (dem === 1 ? 'día' : 'días') + ' de demora</span></td>';
            } else if (d === 0) {
              html += '<td><span class="badge badge-amber">VENCE HOY (0 días)</span></td>';
            } else {
              html += '<td><span class="badge badge-green">En plazo · ' + d + ' ' + (d === 1 ? 'día' : 'días') + '</span></td>';
            }
          } else if (c === 'ESTADO PATENTE' || c === 'CUENTA CON PATENTE' || c === 'PERMISO AL DIA') {
            const up = String(val).toUpperCase();
            const cls = (up === 'SI' || up === 'AL DIA') ? 'badge-green' : (up === 'NO' || up === 'EN MORA' || up === 'VENCIDO') ? 'badge-red' : 'badge-amber';
            html += '<td><span class="badge ' + cls + '">' + this.esc(val || '-') + '</span></td>';
          } else {
            html += '<td>' + this.esc(String(val).substring(0, 60)) + '</td>';
          }
        });
        html += '<td style="white-space:nowrap;">' +
          '<button class="btn btn-outline btn-sm" onclick="App.openDetailModal(\'' + this.escJs(tableName) + '\',' + r._RowNumber + ')">Ver</button> ' +
          '<button class="btn btn-outline btn-sm" onclick="App.editRow(\'' + this.escJs(tableName) + '\',' + r._RowNumber + ')">Editar</button>' +
          '</td></tr>';
      });
      html += '</tbody></table></div>';
    }

    document.getElementById('appView').innerHTML = html;
  },

  editRow(tableName, rowNumber) {
    const row = (this.currentTableData.rows || []).find(r => Number(r._RowNumber) === Number(rowNumber));
    if (!row) return;
    const schema = this.boot.schemas[tableName];
    this.navigate({ kind: 'form', table: tableName, title: 'Editar ' + schema.label, record: row });
  },

  openDetailModal(tableName, rowNumber) {
    const row = (this.currentTableData.rows || []).find(r => Number(r._RowNumber) === Number(rowNumber));
    if (!row) return;
    const schema = this.boot.schemas[tableName];

    document.getElementById('modalTitle').textContent = schema.label + ' — ' + (row[schema.labelCol] || row.ID || '#' + rowNumber);
    let body = '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;">';
    if (row['TELEFONO']) body += '<a class="btn btn-outline btn-sm" href="tel:' + this.esc(row['TELEFONO']) + '">📞 Llamar</a>';
    if (row['EMAIL']) body += '<a class="btn btn-outline btn-sm" href="mailto:' + this.esc(row['EMAIL']) + '">✉️ Correo</a>';
    if (row['UBICACION']) body += '<a class="btn btn-outline btn-sm" target="_blank" href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(row['UBICACION']) + '">📍 Ver Mapa</a>';
    if (row['PDF'] && String(row['PDF']).startsWith('http')) {
      body += '<a class="btn btn-success btn-sm" target="_blank" href="' + this.esc(row['PDF']) + '">📄 Abrir PDF</a>';
    }
    if (schema.hasPdfBot) {
      body += '<button class="btn btn-primary btn-sm" onclick="App.regeneratePdf(\'' + this.escJs(tableName) + '\',' + rowNumber + ')">🔄 Generar PDF</button>';
    }
    body += '<button class="btn btn-danger btn-sm" onclick="App.deleteRow(\'' + this.escJs(tableName) + '\',' + rowNumber + ')">🗑️ Eliminar</button></div>';

    schema.columns.forEach(col => {
      const val = row[col.name];
      if (val === undefined || val === null || val === '') return;
      let valHtml = this.esc(val);
      if ((col.type === 'Image' || col.type === 'Signature' || col.type === 'File' || col.type === 'Url') && String(val).startsWith('http')) {
        valHtml = '<a href="' + this.esc(val) + '" target="_blank" style="color:var(--accent);font-weight:600;">Abrir archivo en Drive ↗</a>';
      }
      body += '<div class="detail-row"><strong>' + this.esc(col.displayName || col.name) + '</strong><span>' + valHtml + '</span></div>';
    });

    document.getElementById('modalBody').innerHTML = body;
    document.getElementById('detailModal').classList.add('open');
  },

  closeModal() {
    this.stopQrScanner();
    document.getElementById('detailModal').classList.remove('open');
  },

  regeneratePdf(tableName, rowNumber) {
    this.showLoader('Generando informe PDF en Drive...');
    google.script.run
      .withSuccessHandler(res => {
        this.hideLoader();
        this.closeModal();
        this.toast('PDF generado y guardado en Drive.');
        if (res && res.pdf && res.pdf.url) window.open(res.pdf.url, '_blank');
        this.renderTable(tableName);
      })
      .withFailureHandler(err => {
        this.hideLoader();
        this.toast('Error PDF: ' + err.message);
      })
      .apiRegeneratePdf(tableName, rowNumber);
  },

  deleteRow(tableName, rowNumber) {
    if (!confirm('¿Seguro que deseas borrar este registro?')) return;
    this.showLoader('Eliminando registro...');
    google.script.run
      .withSuccessHandler(() => {
        this.hideLoader();
        this.closeModal();
        this.toast('Registro eliminado.');
        this.renderTable(tableName);
      })
      .withFailureHandler(err => {
        this.hideLoader();
        this.toast('Error al eliminar: ' + err.message);
      })
      .apiDeleteRecord(tableName, rowNumber);
  },

  /**
   * Exporta la tabla actual como archivo real Excel (.xlsx) en el orden exacto de columnas.
   */
  exportCurrentTableXLSX(tableName) {
    if (!this.currentTableData || !this.currentTableData.rows) return;
    const schema = this.boot.schemas[tableName];
    const headers = schema ? schema.columns.map(c => c.name) : this.currentTableData.headers;
    const rows = this.currentTableData.rows;

    if (typeof XLSX !== 'undefined') {
      const aoa = [headers];
      rows.forEach(r => {
        aoa.push(headers.map(h => r[h] !== undefined && r[h] !== null ? r[h] : ''));
      });
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      XLSX.utils.book_append_sheet(wb, ws, tableName.substring(0, 31));
      XLSX.writeFile(wb, tableName.replace(/\s+/g, '_') + '_' + new Date().toISOString().slice(0, 10) + '.xlsx');
      this.toast('Archivo Excel (.xlsx) descargado con orden exacto de columnas.');
    } else {
      const csvLines = [headers.map(h => '"' + String(h).replace(/"/g, '""') + '"').join(';')];
      rows.forEach(r => {
        csvLines.push(headers.map(h => '"' + String(r[h] || '').replace(/"/g, '""') + '"').join(';'));
      });
      const blob = new Blob(['\uFEFF' + csvLines.join('\n')], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = tableName.replace(/\s+/g, '_') + '_' + new Date().toISOString().slice(0, 10) + '.csv';
      a.click();
    }
  },

  getQuadrants() {
    try {
      const saved = localStorage.getItem('INSPECTOR_CUSTOM_QUADRANTS_V1');
      if (saved) {
        const arr = JSON.parse(saved);
        if (Array.isArray(arr) && arr.length > 0) return arr;
      }
    } catch (e) {}
    return this._getDefaultQuadrants();
  },

  _pointInPolygon(lat, lng, poly) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const xi = poly[i][0], yi = poly[i][1];
      const xj = poly[j][0], yj = poly[j][1];
      const intersect = ((yi > lng) !== (yj > lng)) &&
        (lat < (xj - xi) * (lng - yi) / ((yj - yi) || 1e-12) + xi);
      if (intersect) inside = !inside;
    }
    return inside;
  },

  detectQuadrant(lat, lng) {
    const la = Number(lat), ln = Number(lng);
    if (isNaN(la) || isNaN(ln)) return null;
    const qs = this.getQuadrants();
    for (let i = 0; i < qs.length; i++) {
      if (qs[i].polygon && qs[i].polygon.length >= 3 && this._pointInPolygon(la, ln, qs[i].polygon)) {
        return qs[i];
      }
    }
    return null;
  },

  _polygonCentroid(poly) {
    let latSum = 0, lngSum = 0;
    poly.forEach(p => { latSum += p[0]; lngSum += p[1]; });
    return [latSum / poly.length, lngSum / poly.length];
  },

  renderMap(tableName) {
    const tablesWithLoc = ['COMERCIO', 'FUERA DE HORA', 'GIGANTOGRAFIA', 'PATENTES EN MORA', 'ASISTENCIA', 'REPORTE', 'SEMANA PEÑAFLORINA', 'FERIAS NAVIDEÑAS'];
    let opts = '';
    tablesWithLoc.forEach(t => {
      opts += '<option value="' + t + '"' + (t === tableName ? ' selected' : '') + '>' + this.esc(this.boot.schemas[t].label) + '</option>';
    });

    const hasCustom = Boolean(localStorage.getItem('INSPECTOR_CUSTOM_QUADRANTS_V1'));
    this.mapState = {
      tableName,
      points: [],
      selectedQuadrant: 'ALL',
      showGeofences: true,
      geofenceLayer: null,
      markersLayer: null,
      polyMap: {}

    document.getElementById('appView').innerHTML =

      '<h2>Mapa de Fiscalizaciones por Cuadrantes</h2>' +

          const q = this.detectQuadrant(p.lat, p.lng);
          return Object.assign({}, p, {
            quadrantId: q ? q.id : 'SIN_CUADRANTE',

            quadrantUnit: q ? q.unidad : '-',

        });
        this.mapState.points = enriched;

          attribution: '&copy; OpenStreetMap'

        this.mapState.geofenceLayer = L.layerGroup().addTo(this.leafletMap);

        this.hideLoader();
        this.toast('Error mapa: ' + err.message);
      })

  _renderQuadrantControlsAndLayers() {
    const st = this.mapState;
    if (!st || !this.leafletMap) return;
    const qs = this.getQuadrants();
    const counts = { ALL: st.points.length, SIN_CUADRANTE: 0 };
    qs.forEach(q => { counts[q.id] = 0; });
    st.points.forEach(p => {
      if (counts[p.quadrantId] !== undefined) counts[p.quadrantId]++;
      else counts.SIN_CUADRANTE++;

    // 1. Render chips resumen arriba del mapa

          fillColor: q.color,
          fillOpacity: isSel ? 0.28 : (isDim ? 0.04 : (isRural ? 0.07 : 0.20)),
          dashArray: isRural ? '6, 5' : null
        });
        poly.on('click', () => this.selectMapQuadrant(q.id));
        poly.bindTooltip(
          '<div class="quadrant-map-label" style="border-left:4px solid ' + q.color + ';">' + this.esc(q.id) + ' (' + (counts[q.id] || 0) + ')</div>',
          { permanent: true, direction: 'center', className: 'leaflet-tooltip-plain', opacity: isDim ? 0.45 : 0.95 }
        );
        poly.addTo(st.geofenceLayer);
        st.polyMap[q.id] = poly;
      });
    }

    // 4. Dibujar marcadores filtrados
    st.markersLayer.clearLayers();
    const filtered = st.selectedQuadrant === 'ALL'
      ? st.points
      : st.points.filter(p => p.quadrantId === st.selectedQuadrant);

    const bounds = [];
    filtered.forEach(p => {
      bounds.push([p.lat, p.lng]);
      L.circleMarker([p.lat, p.lng], {
        radius: 7,
        color: '#ffffff',
        weight: 2,
        fillColor: p.quadrantColor || '#2563eb',
        fillOpacity: 0.92
      }).addTo(st.markersLayer)
        .bindPopup(
          '<div style="font-size:12.5px;line-height:1.45;">' +
          '<span style="display:inline-block;background:' + p.quadrantColor + ';color:#fff;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;margin-bottom:4px;">' + this.esc(p.quadrantName) + '</span><br>' +
          '<strong>' + this.esc(p.title) + '</strong><br>' +
          this.esc(p.subtitle) + '<br>' +
          '<small>Inspector: ' + this.esc(p.inspector) + ' | ' + this.esc(p.fecha) + '</small></div>'
        );
    });

    if (st.selectedQuadrant !== 'ALL' && st.polyMap[st.selectedQuadrant]) {
      this.leafletMap.fitBounds(st.polyMap[st.selectedQuadrant].getBounds(), { padding: [26, 26] });
    } else if (bounds.length > 0) {
      this.leafletMap.fitBounds(bounds, { padding: [28, 28], maxZoom: 15 });
    }
  },

  selectMapQuadrant(quadrantId) {
    if (!this.mapState) return;
    this.mapState.selectedQuadrant = (this.mapState.selectedQuadrant === quadrantId && quadrantId !== 'ALL') ? 'ALL' : quadrantId;
    this._renderQuadrantControlsAndLayers();

    this._renderQuadrantControlsAndLayers();
  },

  importQuadrantsFile(input) {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const text = String(e.target.result || '');
        const palette = ['#2563eb', '#0891b2', '#7c3aed', '#059669', '#d97706', '#dc2626', '#e11d48', '#65a30d', '#0284c7', '#9333ea'];
        const imported = [];

        if (file.name.toLowerCase().endsWith('.kml')) {
          const doc = new DOMParser().parseFromString(text, 'text/xml');
          const placemarks = doc.querySelectorAll('Placemark');
          placemarks.forEach((pm, idx) => {
            const name = (pm.querySelector('name') ? pm.querySelector('name').textContent : ('Cuadrante ' + (idx + 1))).trim();
            const desc = (pm.querySelector('description') ? pm.querySelector('description').textContent : '').trim();
            const coordEl = pm.querySelector('Polygon coordinates, coordinates');
            if (!coordEl) return;
            const pts = coordEl.textContent.trim().split(/\s+/).map(pair => {
              const parts = pair.split(',');
              return [Number(parts[1]), Number(parts[0])];
            }).filter(p => !isNaN(p[0]) && !isNaN(p[1]));
            if (pts.length >= 3) {
              imported.push({
                id: name.toUpperCase().slice(0, 16),
                nombre: name,
                tipo: /SR/i.test(name) ? 'RURAL / EXTERIOR' : 'URBANO',
                unidad: /SR/i.test(name) ? 'Seguridad Pública 1410' : 'Carabineros Peñaflor',
                telefono: '1410',
                sectores: desc || 'Geocerca importada desde KML',
                color: palette[idx % palette.length],
                polygon: pts
              });
            }
          });
        } else {
          const geo = JSON.parse(text);
          const feats = geo.features || [];
          feats.forEach((f, idx) => {
            if (!f.geometry) return;
            const ring = f.geometry.type === 'Polygon' ? f.geometry.coordinates[0]
              : (f.geometry.type === 'MultiPolygon' ? f.geometry.coordinates[0][0] : null);
            if (!ring || ring.length < 3) return;
            const props = f.properties || {};
            const name = String(props.name || props.NOMBRE || props.cuadrante || props.CUADRANTE || ('Cuadrante ' + (idx + 1))).trim();
            imported.push({
              id: name.toUpperCase().slice(0, 16),
              nombre: name,
              tipo: /SR/i.test(name) ? 'RURAL / EXTERIOR' : 'URBANO',
              unidad: props.unidad || (/SR/i.test(name) ? 'Seguridad Pública 1410' : 'Carabineros Peñaflor'),
              telefono: props.telefono || '1410',
              sectores: props.sectores || props.description || 'Geocerca importada desde GeoJSON',
              color: props.color || palette[idx % palette.length],
              polygon: ring.map(c => [Number(c[1]), Number(c[0])])
            });
          });
        }

        if (imported.length === 0) {
          this.toast('No se encontraron polígonos válidos en el archivo.');
          return;
        }
        localStorage.setItem('INSPECTOR_CUSTOM_QUADRANTS_V1', JSON.stringify(imported));
        this.toast('Se importaron ' + imported.length + ' geocercas correctamente.');
        this.renderMap(this.mapState.tableName);
      } catch (err) {
        this.toast('Error al leer archivo KML/GeoJSON: ' + err.message);
      }
    };
    reader.readAsText(file);
  },

  resetDefaultQuadrants() {
    localStorage.removeItem('INSPECTOR_CUSTOM_QUADRANTS_V1');
    this.toast('Cuadrantes oficiales de Peñaflor restaurados.');
    this.renderMap(this.mapState ? this.mapState.tableName : 'COMERCIO');
  },

  exportMapQuadrantXLSX() {
    const st = this.mapState;
    if (!st || !st.points) return;
    const rows = st.selectedQuadrant === 'ALL'
      ? st.points
      : st.points.filter(p => p.quadrantId === st.selectedQuadrant);
    const headers = ['MODULO', 'CUADRANTE', 'UNIDAD', 'TITULO', 'DETALLE', 'INSPECTOR', 'FECHA', 'LATITUD', 'LONGITUD'];
    const aoa = [headers];
    rows.forEach(p => {
      aoa.push([st.tableName, p.quadrantName, p.quadrantUnit, p.title, p.subtitle, p.inspector, p.fecha, p.lat, p.lng]);
    });
    if (typeof XLSX !== 'undefined') {
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      XLSX.utils.book_append_sheet(wb, ws, 'CUADRANTES');
      XLSX.writeFile(wb, 'Mapa_' + st.tableName.replace(/\s+/g, '_') + '_' + st.selectedQuadrant + '_' + new Date().toISOString().slice(0, 10) + '.xlsx');
      this.toast('Excel por cuadrante descargado (' + rows.length + ' registros).');
    }
  },

  // ==========================================================================
  // FICHAS DE ASISTENCIA INDEPENDIENTES POR FERIA (PUESTOS 1 AL 100 + QR)
  // ==========================================================================
  _extractPuestoNumber(raw) {
    if (raw === undefined || raw === null) return null;
    const m = String(raw).match(/\d+/);
    if (!m) return null;
    const n = parseInt(m[0], 10);
    return (n >= 1 && n <= 100) ? n : null;
  },

  _getFeriasCatalog() {
    const base = ['MODELO', 'LAS PRADERAS', 'MALLOQUITO', 'MANUEL GONZALES', 'LOS GUINDOS'];
    const set = new Set(base);
    (this.feriaState.allAsistenciaRows || []).forEach(r => {
      const f = String(r['FERIA'] || '').trim().toUpperCase();
      if (f) set.add(f);
    });
    return Array.from(set);
  },

<script>
/**
 * ============================================================================
 * DEPARTAMENTO DE INSPECTORES COMERCIALES - CONTROLADOR FRONTEND SPA + PWA
 * ============================================================================
 */
const App = {
  boot: null,
  history: [],
  currentRoute: null,
  currentTableData: null,
  mediaUploads: {},
  signaturePads: {},
  chartInstances: [],
  leafletMap: null,
  deferredInstallPrompt: null,

  init() {
    this.setupPWA();
    // Cerrar desplegables multi-selección al hacer clic fuera
    document.addEventListener('click', e => {
      if (!e.target.closest('.ms-dropdown')) {
        document.querySelectorAll('.ms-dropdown.open').forEach(el => el.classList.remove('open'));
      }
    });

    this.showLoader('Cargando Departamento de Inspectores Comerciales...');
    google.script.run
      .withSuccessHandler(res => {
        this.hideLoader();
        if (!res || !res.authorized) {
          document.getElementById('appView').innerHTML =
            '<div class="card"><h2>Acceso restringido</h2><p>Tu cuenta (' +
            this.esc(res && res.user ? res.user.email : '') +
            ') no está autorizada para usar esta aplicación.</p></div>';
          return;
        }
        this.boot = res;
        document.getElementById('userEmailLabel').textContent = res.user.email || 'Usuario Municipal';
        this.openTab('menu');
      })
      .withFailureHandler(err => {
        this.hideLoader();
        this.toast('Error al iniciar: ' + err.message);
      })
      .apiGetBootstrap();
  },

  // ==========================================================================
  // PWA INSTALABLE (MÓVIL ANDROID/iOS + ESCRITORIO WINDOWS/MAC)
  // ==========================================================================
  setupPWA() {
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      this.deferredInstallPrompt = e;
      const btn = document.getElementById('btnInstallApp');
      if (btn) btn.style.display = 'inline-flex';
    });
    window.addEventListener('appinstalled', () => {
      this.deferredInstallPrompt = null;
      this.toast('Aplicación instalada correctamente en tu dispositivo.');
    });
  },

  promptInstall() {
    if (this.deferredInstallPrompt) {
      this.deferredInstallPrompt.prompt();
      this.deferredInstallPrompt.userChoice.then(choice => {
        if (choice.outcome === 'accepted') {
          this.toast('Instalando Departamento de Inspectores Comerciales...');
        }
        this.deferredInstallPrompt = null;
      });
      return;
    }

    // Mostrar guía clara para instalar en iPhone/iPad, Android o Escritorio
    document.getElementById('modalTitle').textContent = 'Instalar App (Móvil y Escritorio)';
    document.getElementById('modalBody').innerHTML =
      '<div style="font-size:14px;line-height:1.6;">' +
      '<p>Podés instalar <strong>Departamento de Inspectores Comerciales</strong> como aplicación nativa en tu celular o computador:</p>' +
      '<div class="card" style="margin-bottom:10px;padding:12px;"><strong>📱 Android (Chrome):</strong><br>Tocá el menú <strong>⋮</strong> arriba a la derecha → <strong>"Instalar aplicación"</strong> o <strong>"Agregar a la pantalla principal"</strong>.</div>' +
      '<div class="card" style="margin-bottom:10px;padding:12px;"><strong>🍎 iPhone / iPad (Safari):</strong><br>Tocá el botón <strong>Compartir</strong> (cuadrado con flecha arriba) → <strong>"Agregar a inicio"</strong>.</div>' +
      '<div class="card" style="margin-bottom:0;padding:12px;"><strong>💻 Escritorio (Chrome / Edge):</strong><br>Hacé clic en el ícono de <strong>Instalar (monitor con flecha)</strong> en la barra de direcciones arriba a la derecha.</div>' +
      '</div>';
    document.getElementById('detailModal').classList.add('open');
  },

  // ==========================================================================
  // NAVEGACIÓN
  // ==========================================================================
  openTab(tab) {
    this.history = [];
    document.querySelectorAll('[data-tab]').forEach(el => {
      el.classList.toggle('active', el.getAttribute('data-tab') === tab);
    });

    if (tab === 'menu') {
      this.navigate({ kind: 'menu', table: 'MENU', title: 'Departamento de Inspectores Comerciales' }, false);
    } else if (tab === 'forms') {
      this.navigate({ kind: 'formsHub', title: 'Formularios de Fiscalización' }, false);
    } else if (tab === 'tables') {
      this.navigate({ kind: 'tablesHub', title: 'Listados y Registros Excel' }, false);
    } else if (tab === 'map') {
      this.navigate({ kind: 'map', table: 'COMERCIO', title: 'Mapa de Fiscalizaciones' }, false);
    } else if (tab === 'dashboard') {
      this.navigate({ kind: 'dashboard', title: 'Estadísticas y Dashboard' }, false);
    } else if (tab === 'backup') {
      this.navigate({ kind: 'backup', title: 'Excel, Drive y Conexión en Vivo' }, false);
    }
  },

  navigate(route, pushHistory = true) {
    if (pushHistory && this.currentRoute) {
      this.history.push(this.currentRoute);
    }
    this.currentRoute = route;
    document.getElementById('headerTitle').textContent = route.title || 'Departamento de Inspectores Comerciales';
    document.getElementById('btnBack').classList.toggle('hidden', this.history.length === 0);

    switch (route.kind) {
      case 'menu': this.renderMenuTable(route.table); break;
      case 'formsHub': this.renderFormsHub(); break;
      case 'tablesHub': this.renderTablesHub(); break;
      case 'form': this.renderForm(route.table, route.record || null); break;
      case 'table': this.renderTable(route.table); break;
      case 'links': this.renderDocumentLinks(); break;
      case 'map': this.renderMap(route.table || 'COMERCIO'); break;
      case 'dashboard': this.renderDashboard(); break;
      case 'backup': this.renderBackupPanel(); break;
      default: this.renderMenuTable('MENU');
    }
  },

  goBack() {
    if (this.history.length === 0) return;
    const prev = this.history.pop();
    this.navigate(prev, false);
  },

  refreshCurrent() {
    if (!this.currentRoute) return;
    this.navigate(this.currentRoute, false);
    this.toast('Datos sincronizados');
  },

  openAppSheetViewName(viewName) {
    const mapped = this.boot.viewMap[viewName];
    if (mapped) {
      this.navigate(Object.assign({}, mapped));
      return;
    }
    if (this.boot.schemas[viewName]) {
      this.navigate({ kind: 'table', table: viewName, title: this.boot.schemas[viewName].label || viewName });
      return;
    }
    this.toast('Vista "' + viewName + '" no mapeada todavía.');
  },

  isLiveConnected() {
    return Boolean(window.__GAS_LIVE_CONNECTED__ || (this.boot && this.boot.isLiveBackend));
  },

  // ==========================================================================
  // VISTAS DE MENÚ
  // ==========================================================================
  renderMenuTable(tableName) {
    const rows = (this.boot.navTables && this.boot.navTables[tableName]) || [];
    const schema = this.boot.schemas[tableName] || {};
    const labelKey = schema.keyCol || 'ID MENU';

    let html = '';
    if (tableName === 'MENU') {
      const live = this.isLiveConnected();
      html += '<div class="dept-hero">' +
        '<div class="dept-hero-left">' +
        '<img class="dept-hero-logo" src="https://cristophermaciel.github.io/inspector-comercial/assets/logo-penaflor.jpg" onerror="this.src=\'./assets/logo-penaflor.jpg\'" alt="Logo Peñaflor">' +
        '<div><h2>Departamento de Inspectores Comerciales</h2><p>Dirección de Seguridad Pública — Municipalidad de Peñaflor</p></div>' +
        '</div>' +
        '<div class="conn-badge ' + (live ? 'live' : 'demo') + '" onclick="App.openTab(\'backup\')">' +
        (live ? '🟢 Conectado a Excel / Google Sheets en vivo' : '🟡 Modo Local — Clic para conectar Excel en vivo') +
        '</div></div>';
    } else {
      html += '<div class="section-header"><h2>' + this.esc(this.currentRoute.title) + '</h2></div>';
    }

    if (rows.length > 0) {
      html += '<div class="gallery-grid" style="margin-bottom:20px;">';
      rows.forEach(r => {
        const title = r[labelKey] || r['VISTA'] || 'Opción';
        const vista = r['VISTA'] || '';
        const img = r['IMAGEN'] || '';
        const imgHtml = img && String(img).startsWith('http')
          ? '<img class="card-thumb" src="' + this.esc(img) + '" alt="">'
          : '<div class="card-icon"><span class="material-icons">dashboard_customize</span></div>';

        html += '<div class="menu-card" onclick="App.openAppSheetViewName(\'' + this.escJs(vista) + '\')">' +
          imgHtml + '<div class="card-title">' + this.esc(title) + '</div></div>';
      });
      html += '</div>';
    }

    if (tableName === 'MENU') {
      html += '<div class="section-header"><h2>Módulos de Fiscalización y Gestión</h2></div>';
      html += this._buildQuickCardsHtml();
    }

    document.getElementById('appView').innerHTML = html;
  },

  _buildQuickCardsHtml() {
    const quick = [
      { title: 'Fis. Comercial', icon: 'store', route: { kind: 'form', table: 'COMERCIO', title: 'Fiscalización Comercial' } },
      { title: 'Fis. Fuera de Horario', icon: 'schedule', route: { kind: 'form', table: 'FUERA DE HORA', title: 'Fiscalización Fuera de Horario' } },
      { title: 'Fis. Publicidad', icon: 'campaign', route: { kind: 'form', table: 'GIGANTOGRAFIA', title: 'Fiscalización Publicidad' } },
      { title: 'Patentes en Mora', icon: 'payments', route: { kind: 'form', table: 'PATENTES EN MORA', title: 'Patentes en Mora' } },
      { title: 'Reporte a Jefatura', icon: 'assignment', route: { kind: 'form', table: 'REPORTE', title: 'Reporte a Jefatura' } },
      { title: 'Registro Feria Libre', icon: 'storefront', route: { kind: 'form', table: 'ASISTENCIA', title: 'Registro Feria Libre' } },
      { title: 'Semana Peñaflorina', icon: 'festival', route: { kind: 'form', table: 'SEMANA PEÑAFLORINA', title: 'Semana Peñaflorina' } },
      { title: 'Notif. por Deudas', icon: 'notifications_active', route: { kind: 'table', table: 'Hoja 1', title: 'Notificaciones por Deudas' } },
      { title: 'Mapa Fiscalizaciones', icon: 'map', route: { kind: 'map', table: 'COMERCIO', title: 'Mapa de Fiscalizaciones' } },
      { title: 'Estadísticas / Dashboard', icon: 'bar_chart', route: { kind: 'dashboard', title: 'Estadísticas y Dashboard' } },
      { title: 'Documentos Drive', icon: 'folder_shared', route: { kind: 'links', table: 'DOCUMENTOS', title: 'Documentos Drive' } },
      { title: 'Excel y Drive', icon: 'cloud_sync', route: { kind: 'backup', title: 'Excel, Drive y Conexión en Vivo' } }
    ];

    let html = '<div class="gallery-grid">';
    quick.forEach(q => {
      html += '<div class="menu-card" onclick=\'App.navigate(' + JSON.stringify(q.route) + ')\'>' +
        '<div class="card-icon"><span class="material-icons">' + q.icon + '</span></div>' +
        '<div class="card-title">' + this.esc(q.title) + '</div>' +
        '</div>';
    });
    html += '</div>';
    return html;
  },

  renderFormsHub() {
    const formTables = ['COMERCIO', 'FUERA DE HORA', 'GIGANTOGRAFIA', 'PATENTES EN MORA', 'REPORTE', 'ASISTENCIA', 'SEMANA PEÑAFLORINA', 'Hoja 1', 'FUNCIONARIO'];
    let html = '<div class="section-header"><h2>Formularios de Ingreso</h2></div><div class="gallery-grid">';
    formTables.forEach(t => {
      const s = this.boot.schemas[t];
      html += '<div class="menu-card" onclick="App.navigate({kind:\'form\',table:\'' + this.escJs(t) + '\',title:\'' + this.escJs(s.label) + '\'})">' +
        '<div class="card-icon"><span class="material-icons">' + (s.icon || 'edit_note') + '</span></div>' +
        '<div class="card-title">' + this.esc(s.label) + '</div>' +
        (s.hasPdfBot ? '<span class="badge badge-blue">Auto PDF + Excel</span>' : '<span class="badge badge-blue">Excel</span>') +
        '</div>';
    });
    html += '</div>';
    document.getElementById('appView').innerHTML = html;
  },

  renderTablesHub() {
    const dataTables = ['COMERCIO', 'FUERA DE HORA', 'GIGANTOGRAFIA', 'PATENTES EN MORA', 'REPORTE', 'ASISTENCIA', 'SEMANA PEÑAFLORINA', 'Hoja 1', 'FUNCIONARIO', 'DOCUMENTOS'];
    let html = '<div class="section-header"><h2>Listados y Planillas Excel</h2></div><div class="gallery-grid">';
    dataTables.forEach(t => {
      const s = this.boot.schemas[t];
      html += '<div class="menu-card" onclick="App.navigate({kind:\'table\',table:\'' + this.escJs(t) + '\',title:\'' + this.escJs(s.label) + '\'})">' +
        '<div class="card-icon"><span class="material-icons">' + (s.icon || 'table_rows') + '</span></div>' +
        '<div class="card-title">' + this.esc(s.label) + '</div>' +
        '</div>';
    });
    html += '</div>';
    document.getElementById('appView').innerHTML = html;
  },

  renderDocumentLinks() {
    const rows = (this.boot.navTables && this.boot.navTables['DOCUMENTOS']) || [];
    let html = '<div class="section-header"><h2>Documentos y Enlaces Drive</h2>' +
      '<button class="btn btn-primary btn-sm" onclick="App.navigate({kind:\'form\',table:\'DOCUMENTOS\',title:\'Nuevo Enlace Drive\'})">+ Agregar enlace</button>' +
      '</div><div class="gallery-grid">';
    if (rows.length === 0) {
      html += '<div class="card" style="grid-column:1/-1;">No hay enlaces registrados en la hoja DOCUMENTOS.</div>';
    } else {
      rows.forEach(r => {
        html += '<a class="menu-card" style="text-decoration:none;" href="' + this.esc(r['LINK'] || '#') + '" target="_blank">' +
          '<div class="card-icon"><span class="material-icons">open_in_new</span></div>' +
          '<div class="card-title">' + this.esc(r['IR'] || 'Documento') + '</div></a>';
      });
    }
    html += '</div>';
    document.getElementById('appView').innerHTML = html;
  },

  // ==========================================================================
  // FORMULARIO DINÁMICO (DESPLEGABLES SIMPLES + DESPLEGABLES MULTI-SELECCIÓN)
  // ==========================================================================
  renderForm(tableName, existingRecord) {
    const schema = this.boot.schemas[tableName];
    const isEdit = Boolean(existingRecord && existingRecord._RowNumber);
    this.mediaUploads = {};
    this.signaturePads = {};

    const orderedColNames = schema.formColumns || schema.columns.map(c => c.name);
    const colMap = {};
    schema.columns.forEach(c => colMap[c.name] = c);

    let fieldsHtml = '';
    orderedColNames.forEach(colName => {
      const col = colMap[colName];
      if (!col || col.hiddenInForm || col.readOnly) return;

      const label = col.displayName || col.name;
      const val = existingRecord && existingRecord[col.name] !== undefined ? existingRecord[col.name] : '';
      const fieldId = 'fld_' + col.name.replace(/[^a-zA-Z0-9]/g, '_');

      let inputHtml = '';
      let extraClass = '';

      if (col.type === 'Ref' && col.refTable === 'FUNCIONARIO') {
        inputHtml = '<select class="form-control" data-col="' + this.esc(col.name) + '"><option value="">-- Seleccionar Inspector --</option>';
        (this.boot.funcionarios || []).forEach(f => {
          const sel = String(val) === String(f.nombre) ? ' selected' : '';
          inputHtml += '<option value="' + this.esc(f.nombre) + '"' + sel + '>' + this.esc(f.nombre) + (f.rol ? ' (' + this.esc(f.rol) + ')' : '') + '</option>';
        });
        inputHtml += '</select>';
      } else if (col.type === 'Enum') {
        inputHtml = '<select class="form-control" data-col="' + this.esc(col.name) + '"><option value="">-- Seleccionar opción --</option>';
        (col.values || []).forEach(opt => {
          const sel = String(val).toUpperCase() === String(opt).toUpperCase() ? ' selected' : '';
          inputHtml += '<option value="' + this.esc(opt) + '"' + sel + '>' + this.esc(opt) + '</option>';
        });
        inputHtml += '</select>';
      } else if (col.type === 'EnumList') {
        // DESPLEGABLE CON SELECCIÓN MÚLTIPLE + BUSCADOR + CHECKBOXES
        const selectedArr = String(val || '').split(',').map(s => s.trim()).filter(Boolean);
        inputHtml = this._renderMultiSelectDropdown(fieldId, col.name, col.values || [], selectedArr);
      } else if (col.type === 'LongText') {
        extraClass = 'full-width';
        inputHtml = '<textarea class="form-control" data-col="' + this.esc(col.name) + '">' + this.esc(val) + '</textarea>';
      } else if (col.type === 'Location') {
        inputHtml = '<div class="loc-row">' +
          '<input type="text" class="form-control" id="' + fieldId + '" data-col="' + this.esc(col.name) + '" value="' + this.esc(val) + '" placeholder="-33.6063, -70.8764">' +
          '<button type="button" class="btn btn-outline btn-sm" onclick="App.captureGPS(\'' + fieldId + '\')" title="Capturar GPS"><span class="material-icons">my_location</span></button>' +
          '</div>';
      } else if (col.type === 'Image') {
        inputHtml = '<div class="photo-box">' +
          '<input type="file" accept="image/*" capture="environment" onchange="App.handlePhotoSelect(this, \'' + this.escJs(col.name) + '\', \'' + fieldId + '_prev\')">' +
          '<img id="' + fieldId + '_prev" class="photo-preview" src="' + (val && String(val).startsWith('http') ? this.esc(val) : '') + '" style="' + (val && String(val).startsWith('http') ? 'display:inline-block;' : '') + '">' +
          '</div>';
      } else if (col.type === 'Signature') {
        extraClass = 'full-width';
        inputHtml = '<canvas id="' + fieldId + '_sig" class="sig-pad" data-sig-col="' + this.esc(col.name) + '"></canvas>' +
          '<div style="margin-top:6px;display:flex;justify-content:flex-end;">' +
          '<button type="button" class="btn btn-outline btn-sm" onclick="App.clearSignature(\'' + fieldId + '_sig\')">Limpiar Firma</button>' +
          '</div>';
      } else if (col.type === 'Number' || col.type === 'Price') {
        inputHtml = '<input type="number" step="any" class="form-control" data-col="' + this.esc(col.name) + '" value="' + this.esc(val) + '">';
      } else if (col.type === 'Date') {
        inputHtml = '<input type="date" class="form-control" data-col="' + this.esc(col.name) + '" value="' + this.esc(val) + '">';
      } else if (col.type === 'Email') {
        inputHtml = '<input type="email" class="form-control" data-col="' + this.esc(col.name) + '" value="' + this.esc(val) + '">';
      } else if (col.type === 'Phone') {
        inputHtml = '<input type="tel" class="form-control" data-col="' + this.esc(col.name) + '" value="' + this.esc(val) + '">';
      } else if (col.type === 'Url') {
        inputHtml = '<input type="url" class="form-control" data-col="' + this.esc(col.name) + '" value="' + this.esc(val) + '">';
      } else {
        inputHtml = '<input type="text" class="form-control" data-col="' + this.esc(col.name) + '" value="' + this.esc(val) + '">';
      }

      fieldsHtml += '<div class="form-field ' + extraClass + '"><label>' + this.esc(label) + '</label>' + inputHtml + '</div>';
    });

    const html = '<div class="section-header">' +
      '<h2>' + (isEdit ? 'Editar: ' : 'Nuevo: ') + this.esc(schema.label) + '</h2>' +
      '<button class="btn btn-outline btn-sm" onclick="App.navigate({kind:\'table\',table:\'' + this.escJs(tableName) + '\',title:\'' + this.escJs(schema.label) + '\'})">Ver Listado</button>' +
      '</div>' +
      '<form id="dynamicForm" class="card" onsubmit="App.submitForm(event, \'' + this.escJs(tableName) + '\', ' + (isEdit ? Number(existingRecord._RowNumber) : 'null') + ', \'' + this.escJs(isEdit ? (existingRecord[schema.keyCol] || '') : '') + '\')">' +
      '<div class="form-grid">' + fieldsHtml + '</div>' +
      '<div style="margin-top:20px;display:flex;gap:10px;justify-content:flex-end;">' +
      '<button type="button" class="btn btn-outline" onclick="App.goBack()">CANCELAR</button>' +
      '<button type="submit" class="btn btn-primary"><span class="material-icons">save</span> GUARDAR EN EXCEL' + (!isEdit && schema.hasPdfBot ? ' Y PDF' : '') + '</button>' +
      '</div></form>';

    document.getElementById('appView').innerHTML = html;
    this.initSignaturePads();
  },

  _renderMultiSelectDropdown(fieldId, colName, values, selectedArr) {
    let tagsHtml = '';
    if (selectedArr.length === 0) {
      tagsHtml = '<span class="ms-placeholder">Seleccionar una o varias opciones...</span>';
    } else {
      selectedArr.forEach(v => {
        tagsHtml += '<span class="ms-tag">' + this.esc(v) + '</span>';
      });
    }

    let optsHtml = '';
    values.forEach(opt => {
      const checked = selectedArr.indexOf(opt) !== -1 ? ' checked' : '';
      optsHtml += '<label class="ms-opt" style="text-transform:none;font-weight:400;margin:0;letter-spacing:0;">' +
        '<input type="checkbox" value="' + this.esc(opt) + '"' + checked + ' onchange="App.syncMultiSelect(\'' + fieldId + '\')">' +
        '<span>' + this.esc(opt) + '</span></label>';
    });

    return '<div class="ms-dropdown" id="ms_' + fieldId + '" data-enumlist="' + this.esc(colName) + '">' +
      '<div class="ms-trigger" onclick="App.toggleMultiSelect(\'' + fieldId + '\')">' +
      '<div class="ms-tags" id="ms_tags_' + fieldId + '" style="display:flex;flex-wrap:wrap;gap:5px;">' + tagsHtml + '</div>' +
      '<span class="material-icons ms-arrow">expand_more</span>' +
      '</div>' +
      '<div class="ms-panel">' +
      '<input type="text" class="ms-search" placeholder="Filtrar opciones..." oninput="App.filterMultiSelect(\'' + fieldId + '\', this.value)">' +
      '<div class="ms-actions">' +
      '<button type="button" onclick="App.setAllMultiSelect(\'' + fieldId + '\', true)">Seleccionar todas</button>' +
      '<button type="button" onclick="App.setAllMultiSelect(\'' + fieldId + '\', false)">Limpiar</button>' +
      '<button type="button" onclick="App.toggleMultiSelect(\'' + fieldId + '\')">Listo ✓</button>' +
      '</div>' +
      '<div class="ms-options" id="ms_opts_' + fieldId + '">' + optsHtml + '</div>' +
      '</div></div>';
  },

  toggleMultiSelect(fieldId) {
    const el = document.getElementById('ms_' + fieldId);
    if (!el) return;
    const wasOpen = el.classList.contains('open');
    document.querySelectorAll('.ms-dropdown.open').forEach(d => d.classList.remove('open'));
    if (!wasOpen) el.classList.add('open');
  },

  filterMultiSelect(fieldId, query) {
    const q = (query || '').toLowerCase();
    document.querySelectorAll('#ms_opts_' + fieldId + ' .ms-opt').forEach(opt => {
      const txt = opt.textContent.toLowerCase();
      opt.style.display = txt.indexOf(q) !== -1 ? 'flex' : 'none';
    });
  },

  setAllMultiSelect(fieldId, state) {
    document.querySelectorAll('#ms_opts_' + fieldId + ' input[type="checkbox"]').forEach(cb => {
      if (cb.closest('.ms-opt').style.display !== 'none') cb.checked = state;
    });
    this.syncMultiSelect(fieldId);
  },

  syncMultiSelect(fieldId) {
    const box = document.getElementById('ms_tags_' + fieldId);
    if (!box) return;
    const vals = Array.from(document.querySelectorAll('#ms_opts_' + fieldId + ' input[type="checkbox"]:checked')).map(c => c.value);
    if (vals.length === 0) {
      box.innerHTML = '<span class="ms-placeholder">Seleccionar una o varias opciones...</span>';
    } else {
      box.innerHTML = vals.map(v => '<span class="ms-tag">' + this.esc(v) + '</span>').join('');
    }
  },

  captureGPS(inputId) {
    if (!navigator.geolocation) {
      this.toast('Tu navegador no soporta GPS.');
      return;
    }
    this.toast('Obteniendo ubicación GPS...');
    navigator.geolocation.getCurrentPosition(
      pos => {
        const coords = pos.coords.latitude.toFixed(6) + ', ' + pos.coords.longitude.toFixed(6);
        document.getElementById(inputId).value = coords;
        this.toast('Ubicación capturada: ' + coords);
      },
      err => this.toast('Error GPS: ' + err.message),
      { enableHighAccuracy: true, timeout: 10000 }
    );
  },

  handlePhotoSelect(input, colName, previewId) {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 1280;
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const compressed = canvas.toDataURL('image/jpeg', 0.78);
        this.mediaUploads[colName] = compressed;
        const prev = document.getElementById(previewId);
        if (prev) {
          prev.src = compressed;
          prev.style.display = 'inline-block';
        }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  },

  initSignaturePads() {
    document.querySelectorAll('canvas.sig-pad').forEach(canvas => {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width || 500;
      canvas.height = 170;
      const ctx = canvas.getContext('2d');
      ctx.lineWidth = 2.4;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#101828';

      let drawing = false;
      let hasInk = false;

      const getPos = e => {
        const r = canvas.getBoundingClientRect();
        const t = e.touches ? e.touches[0] : e;
        return { x: (t.clientX - r.left) * (canvas.width / r.width), y: (t.clientY - r.top) * (canvas.height / r.height) };
      };

      const start = e => { drawing = true; hasInk = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); };
      const move = e => { if (!drawing) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); };
      const end = () => { drawing = false; };

      canvas.addEventListener('mousedown', start);
      canvas.addEventListener('mousemove', move);
      window.addEventListener('mouseup', end);
      canvas.addEventListener('touchstart', start, { passive: false });
      canvas.addEventListener('touchmove', move, { passive: false });
      canvas.addEventListener('touchend', end);

      this.signaturePads[canvas.id] = {
        col: canvas.getAttribute('data-sig-col'),
        canvas,
        hasInk: () => hasInk,
        clear: () => { ctx.clearRect(0, 0, canvas.width, canvas.height); hasInk = false; }
      };
    });
  },

  clearSignature(canvasId) {
    if (this.signaturePads[canvasId]) this.signaturePads[canvasId].clear();
  },

  submitForm(event, tableName, rowNumber, existingKey) {
    event.preventDefault();
    const form = document.getElementById('dynamicForm');
    const schema = this.boot.schemas[tableName];
    const record = {};

    if (rowNumber) record._RowNumber = rowNumber;
    if (existingKey && schema.keyCol && schema.keyCol !== '_RowNumber') {
      record[schema.keyCol] = existingKey;
    }

    form.querySelectorAll('[data-col]').forEach(el => {
      record[el.getAttribute('data-col')] = el.value;
    });

    // Leer todos los desplegables multi-selección
    form.querySelectorAll('[data-enumlist]').forEach(group => {
      const col = group.getAttribute('data-enumlist');
      const selected = Array.from(group.querySelectorAll('input[type="checkbox"]:checked')).map(c => c.value);
      record[col] = selected.join(' , ');
    });

    Object.keys(this.signaturePads).forEach(id => {
      const pad = this.signaturePads[id];
      if (pad.hasInk()) {
        this.mediaUploads[pad.col] = pad.canvas.toDataURL('image/png');
      }
    });

    this.showLoader('Guardando datos en orden exacto en Excel/Sheets y Drive...');
    google.script.run
      .withSuccessHandler(res => {
        this.hideLoader();
        if (res && res.ok) {
          let msg = res.isEdit ? 'Registro actualizado en la planilla.' : 'Registro guardado en orden exacto en la planilla.';
          if (res.pdf && res.pdf.url) msg += ' PDF generado automáticamente.';
          this.toast(msg);
          this.navigate({ kind: 'table', table: tableName, title: schema.label });
        }
      })
      .withFailureHandler(err => {
        this.hideLoader();
        this.toast('Error al guardar: ' + err.message);
      })
      .apiSaveRecord(tableName, record, this.mediaUploads);
  },

  // ==========================================================================
  // VISTAS DE TABLA / LISTADOS + EXPORTACIÓN EXCEL .XLSX EN ORDEN EXACTO
  // ==========================================================================
  renderTable(tableName) {
    const schema = this.boot.schemas[tableName];
    this.showLoader('Cargando ' + schema.label + '...');
    google.script.run
      .withSuccessHandler(data => {
        this.hideLoader();
        this.currentTableData = data;
        this._paintTable(tableName, data, '');
      })
      .withFailureHandler(err => {
        this.hideLoader();
        this.toast('Error cargando tabla: ' + err.message);
      })
      .apiGetTableRows(tableName);
  },

  _paintTable(tableName, data, query) {
    const schema = this.boot.schemas[tableName];
    const cols = schema.tableColumns || schema.columns.slice(0, 6).map(c => c.name);
    const q = (query || '').toLowerCase();

    const filtered = (data.rows || []).filter(r => {
      if (!q) return true;
      return Object.values(r).some(v => String(v || '').toLowerCase().indexOf(q) !== -1);
    });

    let summaryBanner = '';
    if (tableName === 'PATENTES EN MORA' && data.summary) {
      summaryBanner = '<div class="kpi-grid"><div class="kpi-card">' +
        '<div class="kpi-label">TOTAL DE PATENTES MOROSAS</div>' +
        '<div class="kpi-value">$' + Number(data.summary.totalPatentesMorosas || 0).toLocaleString('es-CL') + '</div>' +
        '</div><div class="kpi-card">' +
        '<div class="kpi-label">REGISTROS TOTALES</div>' +
        '<div class="kpi-value">' + filtered.length + '</div>' +
        '</div></div>';
    }

    let html = '<div class="section-header">' +
      '<h2>' + this.esc(schema.label) + ' <span class="badge badge-blue">' + filtered.length + '</span></h2>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
      '<button class="btn btn-success btn-sm" onclick="App.exportCurrentTableXLSX(\'' + this.escJs(tableName) + '\')"><span class="material-icons" style="font-size:16px;">table_view</span> Descargar Excel (.xlsx)</button>' +
      '<button class="btn btn-primary btn-sm" onclick="App.navigate({kind:\'form\',table:\'' + this.escJs(tableName) + '\',title:\'' + this.escJs(schema.label) + '\'})"><span class="material-icons" style="font-size:16px;">add</span> NUEVO</button>' +
      '</div></div>' +
      summaryBanner +
      '<div class="toolbar">' +
      '<input type="search" class="form-control search-input" placeholder="Buscar por local, RUT, inspector, dirección..." value="' + this.esc(query) + '" oninput="App._paintTable(\'' + this.escJs(tableName) + '\', App.currentTableData, this.value)">' +
      '</div>';

    if (filtered.length === 0) {
      html += '<div class="card" style="text-align:center;color:var(--muted);">No se encontraron registros.</div>';
    } else {
      html += '<div class="table-wrap"><table class="data-table"><thead><tr>';
      cols.forEach(c => html += '<th>' + this.esc(c) + '</th>');
      html += '<th>ACCIONES</th></tr></thead><tbody>';

      filtered.slice(0, 200).forEach(r => {
        html += '<tr>';
        cols.forEach(c => {
          const val = r[c] !== undefined ? r[c] : '';
          if (c === 'PDF' && String(val).startsWith('http')) {
            html += '<td><a class="badge badge-green" href="' + this.esc(val) + '" target="_blank">Abrir PDF</a></td>';
          } else if (c === 'ESTADO PATENTE' || c === 'CUENTA CON PATENTE' || c === 'PERMISO AL DIA') {
            const up = String(val).toUpperCase();
            const cls = (up === 'SI' || up === 'AL DIA') ? 'badge-green' : (up === 'NO' || up === 'EN MORA' || up === 'VENCIDO') ? 'badge-red' : 'badge-amber';
            html += '<td><span class="badge ' + cls + '">' + this.esc(val || '-') + '</span></td>';
          } else {
            html += '<td>' + this.esc(String(val).substring(0, 60)) + '</td>';
          }
        });
        html += '<td style="white-space:nowrap;">' +
          '<button class="btn btn-outline btn-sm" onclick="App.openDetailModal(\'' + this.escJs(tableName) + '\',' + r._RowNumber + ')">Ver</button> ' +
          '<button class="btn btn-outline btn-sm" onclick="App.editRow(\'' + this.escJs(tableName) + '\',' + r._RowNumber + ')">Editar</button>' +
          '</td></tr>';
      });
      html += '</tbody></table></div>';
    }

    document.getElementById('appView').innerHTML = html;
  },

  editRow(tableName, rowNumber) {
    const row = (this.currentTableData.rows || []).find(r => Number(r._RowNumber) === Number(rowNumber));
    if (!row) return;
    const schema = this.boot.schemas[tableName];
    this.navigate({ kind: 'form', table: tableName, title: 'Editar ' + schema.label, record: row });
  },

  openDetailModal(tableName, rowNumber) {
    const row = (this.currentTableData.rows || []).find(r => Number(r._RowNumber) === Number(rowNumber));
    if (!row) return;
    const schema = this.boot.schemas[tableName];

    document.getElementById('modalTitle').textContent = schema.label + ' — ' + (row[schema.labelCol] || row.ID || '#' + rowNumber);
    let body = '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;">';
    if (row['TELEFONO']) body += '<a class="btn btn-outline btn-sm" href="tel:' + this.esc(row['TELEFONO']) + '">📞 Llamar</a>';
    if (row['EMAIL']) body += '<a class="btn btn-outline btn-sm" href="mailto:' + this.esc(row['EMAIL']) + '">✉️ Correo</a>';
    if (row['UBICACION']) body += '<a class="btn btn-outline btn-sm" target="_blank" href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(row['UBICACION']) + '">📍 Ver Mapa</a>';
    if (row['PDF'] && String(row['PDF']).startsWith('http')) {
      body += '<a class="btn btn-success btn-sm" target="_blank" href="' + this.esc(row['PDF']) + '">📄 Abrir PDF</a>';
    }
    if (schema.hasPdfBot) {
      body += '<button class="btn btn-primary btn-sm" onclick="App.regeneratePdf(\'' + this.escJs(tableName) + '\',' + rowNumber + ')">🔄 Generar PDF</button>';
    }
    body += '<button class="btn btn-danger btn-sm" onclick="App.deleteRow(\'' + this.escJs(tableName) + '\',' + rowNumber + ')">🗑️ Eliminar</button></div>';

    schema.columns.forEach(col => {
      const val = row[col.name];
      if (val === undefined || val === null || val === '') return;
      let valHtml = this.esc(val);
      if ((col.type === 'Image' || col.type === 'Signature' || col.type === 'File' || col.type === 'Url') && String(val).startsWith('http')) {
        valHtml = '<a href="' + this.esc(val) + '" target="_blank" style="color:var(--accent);font-weight:600;">Abrir archivo en Drive ↗</a>';
      }
      body += '<div class="detail-row"><strong>' + this.esc(col.displayName || col.name) + '</strong><span>' + valHtml + '</span></div>';
    });

    document.getElementById('modalBody').innerHTML = body;
    document.getElementById('detailModal').classList.add('open');
  },

  closeModal() {
    document.getElementById('detailModal').classList.remove('open');
  },

  regeneratePdf(tableName, rowNumber) {
    this.showLoader('Generando informe PDF en Drive...');
    google.script.run
      .withSuccessHandler(res => {
        this.hideLoader();
        this.closeModal();
        this.toast('PDF generado y guardado en Drive.');
        if (res && res.pdf && res.pdf.url) window.open(res.pdf.url, '_blank');
        this.renderTable(tableName);
      })
      .withFailureHandler(err => {
        this.hideLoader();
        this.toast('Error PDF: ' + err.message);
      })

  deleteRow(tableName, rowNumber) {
    if (!confirm('¿Seguro que deseas borrar este registro?')) return;
    this.showLoader('Eliminando registro...');
    google.script.run
      .withSuccessHandler(() => {
        this.hideLoader();
        this.closeModal();
        this.toast('Registro eliminado.');
        this.renderTable(tableName);
      })
      .withFailureHandler(err => {
        this.hideLoader();
        this.toast('Error al eliminar: ' + err.message);
      })
      .apiDeleteRecord(tableName, rowNumber);
  },

  /**
   * Exporta la tabla actual como archivo real Excel (.xlsx) en el orden exacto de columnas.
   */
  exportCurrentTableXLSX(tableName) {
    if (!this.currentTableData || !this.currentTableData.rows) return;
    const schema = this.boot.schemas[tableName];
    const headers = schema ? schema.columns.map(c => c.name) : this.currentTableData.headers;
    const rows = this.currentTableData.rows;

    if (typeof XLSX !== 'undefined') {
      const aoa = [headers];
      rows.forEach(r => {
        aoa.push(headers.map(h => r[h] !== undefined && r[h] !== null ? r[h] : ''));
      });
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      XLSX.utils.book_append_sheet(wb, ws, tableName.substring(0, 31));
      XLSX.writeFile(wb, tableName.replace(/\s+/g, '_') + '_' + new Date().toISOString().slice(0, 10) + '.xlsx');
      this.toast('Archivo Excel (.xlsx) descargado con orden exacto de columnas.');
    } else {
      const csvLines = [headers.map(h => '"' + String(h).replace(/"/g, '""') + '"').join(';')];
      rows.forEach(r => {
        csvLines.push(headers.map(h => '"' + String(r[h] || '').replace(/"/g, '""') + '"').join(';'));
      });
      const blob = new Blob(['\uFEFF' + csvLines.join('\n')], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = tableName.replace(/\s+/g, '_') + '_' + new Date().toISOString().slice(0, 10) + '.csv';
      a.click();
    }
  },

    let opts = '';

      opts += '<option value="' + t + '"' + (t === tableName ? ' selected' : '') + '>' + this.esc(this.boot.schemas[t].label) + '</option>';
    });

    document.getElementById('appView').innerHTML =
      '<div class="section-header"><h2>Mapa de Fiscalizaciones</h2>' +
      '<select class="form-control" style="max-width:260px;" onchange="App.renderMap(this.value)">' + opts + '</select>' +
      '</div><div id="mapContainer"></div>';

    this.showLoader('Cargando ubicaciones GPS...');
    google.script.run
      .withSuccessHandler(points => {
        this.hideLoader();
        if (this.leafletMap) { this.leafletMap.remove(); this.leafletMap = null; }
        this.leafletMap = L.map('mapContainer').setView([-33.6063, -70.8764], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; OpenStreetMap'
        }).addTo(this.leafletMap);

        const bounds = [];
        (points || []).forEach(p => {
          bounds.push([p.lat, p.lng]);
          L.marker([p.lat, p.lng]).addTo(this.leafletMap)
            .bindPopup('<strong>' + this.esc(p.title) + '</strong><br>' +
              this.esc(p.subtitle) + '<br><small>Inspector: ' + this.esc(p.inspector) + ' | ' + this.esc(p.fecha) + '</small>');
        });
        if (bounds.length > 0) this.leafletMap.fitBounds(bounds, { padding: [30, 30] });
        else this.toast('No se encontraron registros con coordenadas GPS en ' + tableName);
      })
      .withFailureHandler(err => {
        this.hideLoader();
        this.toast('Error mapa: ' + err.message);
      })
      .apiGetMapPoints(tableName);
  },

      '<a class="menu-card" style="text-decoration:none;" href="' + this.esc(f.excel ? f.excel.url : '#') + '" target="_blank"><div class="card-icon"><span class="material-icons">table_view</span></div><div class="card-title">RESPALDOS EXCEL (.xlsx)</div></a>' +
      '</div></div>' +
      '<div class="card">' +
      '<h3 style="margin-top:0;">Respaldo Completo en Excel (.xlsx)</h3>' +
      '<p style="color:var(--muted);font-size:13px;">Exporta ambas planillas oficiales en formato Microsoft Excel (.xlsx) manteniendo el orden exacto de columnas y tipos numéricos para tus estadísticas.</p>' +
      '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">' +
      '<button class="btn btn-primary" onclick="App.runExcelBackup()"><span class="material-icons">cloud_download</span> Generar Respaldo Excel Ahora</button>' +
      '<button class="btn btn-outline" onclick="App.toggleDailyBackup(' + (!this.boot.dailyBackupEnabled) + ')">' +
      (this.boot.dailyBackupEnabled ? '🔕 Desactivar Respaldo Diario (23:00)' : '⏰ Activar Respaldo Diario Automático (23:00)') +
      '</button></div>' +
      '<div id="backupListBox" style="margin-top:16px;">Cargando historial de respaldos...</div>' +
      '</div>';

    document.getElementById('appView').innerHTML = html;
    this.loadBackupHistory();
  },

  saveGasApiUrl() {
    const val = (document.getElementById('gasApiUrlInput').value || '').trim();
    if (!val.startsWith('https://script.google.com/')) {
      this.toast('Ingresá una URL válida de Google Apps Script (https://script.google.com/macros/s/.../exec)');
      return;
    }
    localStorage.setItem('INSPECTOR_GAS_API_URL', val);
    this.toast('Conexión guardada. Recargando datos en vivo desde Google Sheets...');
    setTimeout(() => location.reload(), 800);
  },

  clearGasApiUrl() {
    localStorage.removeItem('INSPECTOR_GAS_API_URL');
    this.toast('URL desconectada. Volviendo a modo vista previa local...');
    setTimeout(() => location.reload(), 800);
  },

  loadBackupHistory() {
    google.script.run
      .withSuccessHandler(list => {
        const box = document.getElementById('backupListBox');
        if (!box) return;
        if (!list || list.length === 0) {
          box.innerHTML = '<p style="color:var(--muted);font-size:13px;">Aún no hay respaldos Excel generados.</p>';
          return;
        }
        let html = '<div class="table-wrap"><table class="data-table"><thead><tr><th>Archivo Excel</th><th>Fecha</th><th>Tamaño</th><th>Acción</th></tr></thead><tbody>';
        list.forEach(b => {
          html += '<tr><td>' + this.esc(b.name) + '</td><td>' + this.esc(b.date) + '</td><td>' + b.sizeKb + ' KB</td>' +
            '<td><a class="btn btn-outline btn-sm" href="' + this.esc(b.downloadUrl) + '" target="_blank">Descargar .xlsx</a></td></tr>';
        });
        html += '</tbody></table></div>';
        box.innerHTML = html;
      })
      .apiListExcelBackups();
  },

  runExcelBackup() {
    this.showLoader('Exportando ambas planillas a Excel (.xlsx) en Drive...');
    google.script.run
      .withSuccessHandler(res => {
        this.hideLoader();
        const okCount = (res.files || []).filter(f => f.ok).length;
        this.toast('Respaldo Excel completado (' + okCount + ' archivo(s) .xlsx guardados en Drive).');
        this.loadBackupHistory();
      })
      .withFailureHandler(err => {
        this.hideLoader();
        this.toast('Error respaldo Excel: ' + err.message);
      })
      .apiRunExcelBackup();
  },

  toggleDailyBackup(enable) {
    this.showLoader('Actualizando programación automática...');
    google.script.run
      .withSuccessHandler(res => {
        this.hideLoader();
        this.boot.dailyBackupEnabled = enable;
        this.toast(res.message);
        this.renderBackupPanel();
      })
      .withFailureHandler(err => {
        this.hideLoader();
        this.toast('Error: ' + err.message);
      })
      .apiToggleDailyBackup(enable);
  },

  // ==========================================================================
  // UTILIDADES UI
  // ==========================================================================
  showLoader(text) {
    document.getElementById('loaderText').textContent = text || 'Procesando...';
    document.getElementById('globalLoader').classList.add('open');
  },
  hideLoader() {
    document.getElementById('globalLoader').classList.remove('open');
  },
  toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => el.classList.remove('show'), 4200);
  },
  esc(s) {
    return String(s === undefined || s === null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  },
  escJs(s) {
    return String(s === undefined || s === null ? '' : s).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
  }
};

window.addEventListener('DOMContentLoaded', () => App.init());
</script>
